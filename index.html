<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고창농악 진형 기록기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#eef1f6;color:#2a2a35;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;align-items:flex-start;justify-content:flex-start;padding:8px 16px;background:#ffffff;border-bottom:1px solid #d8dde6;flex-shrink:0;gap:20px;flex-wrap:wrap}
.top-bar h1{font-size:16px;font-weight:500;color:#e94560;white-space:nowrap}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.controls label{font-size:12px;color:#5a6072}
.tab-bar{display:flex;gap:2px;border-bottom:2px solid #d8dde6;margin-bottom:8px}
.tab-btn{padding:7px 18px;background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;color:#7a8296;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;border-radius:6px 6px 0 0}
.tab-btn:hover{background:#eef1f6;color:#2a2a35}
.tab-btn.active{color:#e94560;border-bottom-color:#e94560;background:#f7f8fb}
.tab-panel{display:none;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap;width:100%;min-height:34px}
.tab-panel.active{display:flex}
.controls input[type=number]{width:50px;padding:4px 6px;background:#f7f8fb;border:1px solid #c5ccd8;color:#2a2a35;border-radius:4px;font-size:12px;text-align:center}
.controls input[type=range]{width:80px;accent-color:#e94560}
.btn{padding:5px 12px;border:1px solid #c5ccd8;background:#f2f4f8;color:#2a2a35;border-radius:4px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:#e4e8ef;border-color:#e94560}
.btn.active{background:#e94560;border-color:#e94560;color:#fff}
.btn.export{background:#2a9d5c;border-color:#2a9d5c;color:#fff}
.btn.export:hover{background:#24864e}
.btn.danger{border-color:#d05555;color:#c0392b}
.btn.danger:hover{background:#f5dede}
.main-area{display:flex;flex:1;overflow:hidden}
.stage-container{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;padding:8px}
.stage-label{font-size:13px;color:#e94560;letter-spacing:2px;margin:2px 0}
.stage-wrapper{position:relative;flex:1;width:100%;max-width:1100px;display:flex;align-items:center;justify-content:center}
.canvas-frame{position:relative;display:inline-block}
.size-label{position:absolute;top:6px;right:8px;background:rgba(0,0,0,0.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;z-index:21;pointer-events:none;display:none}
.ctx-menu{position:absolute;z-index:50;background:#fff;border:1px solid #c5ccd8;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.15);padding:4px;display:none;min-width:130px}
.ctx-menu.show{display:block}
.ctx-menu button{display:block;width:100%;text-align:left;padding:7px 12px;background:none;border:none;border-radius:5px;font-size:12px;color:#2a2a35;cursor:pointer;font-family:inherit}
.ctx-menu button:hover{background:#eef1f6}
canvas{border:2px solid #e94560;border-radius:8px;cursor:crosshair;display:block}
.sidebar{width:260px;background:#ffffff;border-left:1px solid #d8dde6;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar h2{font-size:13px;padding:10px 12px;border-bottom:1px solid #d8dde6;color:#e94560;font-weight:500}
.keyframes-list{flex:1;overflow-y:auto;padding:6px}
.keyframe-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:12px;border:1px solid transparent;margin-bottom:4px;transition:all .15s}
.keyframe-item:hover{background:#eef1f6}
.keyframe-item.active{border-color:#e94560;background:#fdecef}
.keyframe-item .num{color:#e94560;font-weight:700;min-width:24px}
.keyframe-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keyframe-item .del{color:#aab;cursor:pointer;font-size:14px;padding:0 4px}
.keyframe-item .del:hover{color:#e94560}
.sidebar-bottom{padding:8px;border-top:1px solid #d8dde6;display:flex;flex-direction:column;gap:6px}
.coord-output{background:#f2f4f8;border:1px solid #d8dde6;border-radius:4px;padding:8px;font-family:monospace;font-size:10px;max-height:120px;overflow-y:auto;white-space:pre;color:#1a8048;line-height:1.4}
.help-text{font-size:11px;color:#8a90a0;line-height:1.5;padding:8px 12px}
.instrument-legend{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;border-bottom:1px solid #d8dde6}
.legend-item{display:flex;align-items:center;gap:3px;font-size:10px;color:#5a6072}
.legend-dot{width:10px;height:10px;border-radius:50%}
.mode-indicator{font-size:11px;padding:3px 8px;border-radius:10px;background:#e94560;color:#fff;font-weight:500}
.playback-controls{display:flex;align-items:center;gap:6px}
.file-row{display:flex;gap:6px}
.file-row .btn{flex:1;white-space:nowrap;padding-left:6px;padding-right:6px}
.speed-display{font-size:11px;color:#5a6072;min-width:30px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2a9d5c;color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
#toast.show{opacity:1}
@keyframes pulse{0%,100%{background:#c0392b}50%{background:#e94560}}
.btn.recording{animation:pulse 1s infinite;border-color:#e94560;color:#fff}
</style>
</head>
<body>

<div class="top-bar">
  <h1>고창농악 진형 기록기</h1>
  <div class="controls" style="flex-direction:column;align-items:stretch;gap:0;flex:1;min-width:0">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="home">홈</button>
      <button class="tab-btn" data-tab="jinpuli">진풀이</button>
      <button class="tab-btn" data-tab="anim">애니메이션</button>
      <button class="tab-btn" data-tab="garak">가락</button>
    </div>

    <!-- 홈 탭 -->
    <div class="tab-panel active" data-panel="home">
      <label>노드 수</label>
      <input type="number" id="nodeCount" value="23" min="1" max="50">
      <label>간격</label>
      <input type="range" id="spacing" min="30" max="150" value="50">
      <span id="spacingVal" style="font-size:11px;min-width:28px">50</span>
      <div style="width:1px;height:20px;background:#0f3460"></div>
      <button class="btn" id="btnToggleCollision" style="opacity:0.55" title="노드 간 충돌(겹침 방지) 켜기/끄기. 켜면 노드가 서로 밀어내 겹치지 않음 (달팽이진용)">⊛ 충돌 OFF</button>
      <div style="width:1px;height:20px;background:#0f3460"></div>
      <button class="btn" id="btnUndo">↩ 실행취소</button>
      <button class="btn" id="btnClear">🗑 초기화</button>
    </div>

    <!-- 진풀이 탭 -->
    <div class="tab-panel" data-panel="jinpuli">
      <span style="font-size:11px;color:#8b95c5" title="진을 원형에 가깝게 그리고 손을 떼면 자동으로 원진으로 정리됩니다">↺ 원진 자동 스냅</span>
      <div style="width:1px;height:20px;background:#0f3460"></div>
      <button class="btn" id="btnNanjin" title="난진: 상쇠 주위로 모이되 같은 악기끼리 인접하지 않게 분산">⁂ 난진</button>
      <button class="btn" id="btnShibiljajin" title="11자진: 상쇠 고정, 상쇠와 판 중심 기준으로 부드럽게 접기">‖ 11자진</button>
      <button class="btn" id="btnToggleSit" title="모든 치배를 앉히거나 일으키기 (shift+클릭으로 개별 토글 가능)">⌄ 앉음</button>
      <button class="btn" id="btnBanyeonpung" title="반연풍: 선택 노드(없으면 전체) 제자리 회전. 첫 클릭 90°, 이후 180°씩">↻ 반연풍</button>
      <div style="width:1px;height:20px;background:#0f3460"></div>
      <button class="btn" id="btnRotate180" title="모든 체인 노드 방향 180° 회전">↻ 180°</button>
      <div style="width:1px;height:20px;background:#d8dde6"></div>
      <button class="btn" id="btnConnect" title="선택한 2명 이상을 진형(체인)에 연결. 분리됐던 노드를 다시 진에 이어붙입니다">🔗 연결</button>
      <button class="btn" id="btnDetach" title="선택한 노드를 진형(체인)에서 분리. 분리된 노드는 개별 이동 가능">✂ 분리</button>
      <div style="width:1px;height:20px;background:#d8dde6"></div>
      <span id="selCount" style="font-size:11px;color:#8b95c5;padding:0 6px" title="선택된 노드 수. 빈 공간 드래그로 선택, Ctrl+드래그로 추가/토글, 빈 공간 클릭으로 전체 해제.">선택: 0</span>
      <button class="btn" id="btnClearSel" title="선택 전체 해제">선택 해제</button>
    </div>

    <!-- 애니메이션 탭 -->
    <div class="tab-panel" data-panel="anim">
      <button class="btn" id="btnRecord">⏺ 녹화</button>
      <span style="font-size:11px;color:#7a8296">녹화 중 노드를 드래그하면 그 동작이 그대로 기록됩니다 (드래그마다 하나의 동작)</span>
      <div style="width:1px;height:20px;background:#d8dde6"></div>
      <button class="btn" id="btnSave">💾 키프레임 저장</button>
    </div>

    <!-- 가락 탭 -->
    <div class="tab-panel" data-panel="garak">
      <label style="font-size:11px" title="장단당 BPM">🎵 BPM</label>
      <input type="range" id="bpmSlider" min="30" max="400" value="120" style="width:110px">
      <input type="number" id="bpmValue" value="120" min="30" max="400" style="width:52px;padding:4px;background:#0f3460;border:1px solid #1a4080;color:#fff;border-radius:4px;font-size:11px;text-align:center">
      <select id="gasrakSelect" title="현재 BPM에 어울리는 가락 (BPM 범위가 정의된 가락만 필터링됨)" style="padding:4px 8px;background:#0f3460;border:1px solid #1a4080;color:#fff;border-radius:4px;font-size:12px;max-width:220px">
        <option value="">— 가락 선택 —</option>
      </select>
    </div>
  </div>
</div>

<div class="main-area">
  <div class="stage-container">
    <div class="stage-label">▲ 무대 뒤에서</div>
    <div class="stage-wrapper">
      <div class="canvas-frame" id="canvasFrame">
        <canvas id="stage"></canvas>
        <div class="size-label" id="sizeLabel"></div>
        <div class="ctx-menu" id="ctxMenu">
          <button data-act="selectNode">이 노드만 선택</button>
          <button data-act="selectChain">체인 전체 선택</button>
          <button data-act="rotate">방향 회전 모드</button>
          <button data-act="detach">이 노드 분리</button>
          <button data-act="sit">앉기/서기 토글</button>
        </div>
      </div>
    </div>
    <div class="stage-label">▼ 청중</div>
  </div>

  <div class="sidebar">
    <h2>키프레임 목록</h2>
    <div class="instrument-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>꽹과리</div>
      <div class="legend-item"><div class="legend-dot" style="background:#9b59b6"></div>징</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3498db"></div>장구</div>
      <div class="legend-item"><div class="legend-dot" style="background:#2ecc71"></div>북</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e67e22"></div>소고</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f1c40f"></div>잡색</div>
    </div>
    <div class="keyframes-list" id="keyframesList"></div>
    <div class="sidebar-bottom">
      <div class="playback-controls">
        <button class="btn" id="btnPlayback">▶ 재생</button>
        <button class="btn" id="btnPlayAccel" title="점점 빨라지는 가속 재생">▶▶ 가속</button>
        <button class="btn" id="btnPrev">◀</button>
        <button class="btn" id="btnNext">▶</button>
        <label style="font-size:11px">속도</label>
        <input type="range" id="playSpeed" min="200" max="2000" value="800" style="width:60px">
        <span class="speed-display" id="speedVal">0.8s</span>
      </div>
      <div class="file-row">
        <button class="btn" id="btnSaveFile" title="현재 진형·녹화 동작·키프레임·끊긴 체인을 .json 파일로 저장">💾 파일로 저장</button>
        <button class="btn" id="btnLoadFile" title="저장한 .json 기록 파일을 불러와 그대로 복원">📂 파일 열기</button>
        <input type="file" id="fileLoadInput" accept=".json,application/json" style="display:none">
      </div>
      <button class="btn export" id="btnExport" style="width:100%">📋 전체 좌표 복사</button>
      <button class="btn export" id="btnExportJSON" style="width:100%">📥 JSON 내보내기</button>
      <div class="coord-output" id="coordOutput">키프레임을 선택하면 좌표가 표시됩니다.</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const container = document.querySelector('.stage-wrapper');

const INSTRUMENTS = [
  {name:'상쇠', color:'#e94560'},
  {name:'부쇠', color:'#e94560'},
  {name:'징1', color:'#9b59b6'},
  {name:'징2', color:'#9b59b6'},
  {name:'장구1', color:'#3498db'},
  {name:'장구2', color:'#3498db'},
  {name:'장구3', color:'#3498db'},
  {name:'장구4', color:'#3498db'},
  {name:'장구5', color:'#3498db'},
  {name:'장구6', color:'#3498db'},
  {name:'북1', color:'#2ecc71'},
  {name:'북2', color:'#2ecc71'},
  {name:'북3', color:'#2ecc71'},
  {name:'북4', color:'#2ecc71'},
  {name:'소고1', color:'#e67e22'},
  {name:'소고2', color:'#e67e22'},
  {name:'소고3', color:'#e67e22'},
  {name:'소고4', color:'#e67e22'},
  {name:'소고5', color:'#e67e22'},
  {name:'소고6', color:'#e67e22'},
  {name:'잡색1', color:'#f1c40f'},
  {name:'잡색2', color:'#f1c40f'},
  {name:'잡색3', color:'#f1c40f'},
];

let nodeCount = 23;
let spacing = 50;

// ─── 공용 수학 헬퍼 ───
// easeInOut: 0→1 구간 가감속 보간 (모든 애니메이션에서 공용)
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
// normAngle: 각도를 -π..π 범위로 정규화 (최단 회전 방향 계산에 공용)
function normAngle(d) {
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
let nodes = [];
let path = [];
let keyframes = [];
let activeKeyframe = -1;
let dragNodeIdx = -1;
let isPlaying = false;
let playTimer = null;
let undoStack = [];
let stageW, stageH;
// 사용자 지정 캔버스 크기 (null = 컨테이너에 자동 맞춤)
let customStageW = null, customStageH = null;

function resizeCanvas() {
  const rect = container.getBoundingClientRect();
  const maxW = rect.width - 16;
  const maxH = rect.height - 8;
  let w, h;
  if (customStageW !== null && customStageH !== null) {
    // 사용자 지정 크기 (컨테이너 범위로 클램프)
    w = Math.min(customStageW, maxW);
    h = Math.min(customStageH, maxH);
  } else {
    const aspect = 16/10;
    w = maxW;
    h = w / aspect;
    if (h > maxH) { h = maxH; w = h * aspect; }
  }
  w = Math.max(280, Math.floor(w));
  h = Math.max(200, Math.floor(h));

  // 중심 기준으로 노드·키프레임 위치 보존 (캔버스 크기가 변할 때)
  const prevW = stageW, prevH = stageH;
  canvas.width = w;
  canvas.height = h;
  stageW = w;
  stageH = h;
  if (prevW !== undefined && prevH !== undefined && (prevW !== w || prevH !== h)) {
    const dx = (w - prevW) / 2;
    const dy = (h - prevH) / 2;
    if (typeof nodes !== 'undefined' && nodes.length) {
      nodes.forEach(n => { n.x += dx; n.y += dy; });
    }
    if (typeof keyframes !== 'undefined' && keyframes.length) {
      keyframes.forEach(kf => {
        if (kf.nodes) kf.nodes.forEach(kn => { kn.px += dx; kn.py += dy; });
      });
    }
  }
  draw();
}

function initNodes() {
  nodes = [];
  snappedCircle = null;
  if (typeof brokenLinks !== 'undefined') brokenLinks.clear();
  const cx = stageW / 2;
  const cy = stageH / 2;

  if (nodeCount === 23) {
    // 원진 프리셋 (고창농악 1마당 원진_1)
    // 상쇠(1번)는 원 중앙에 분리 상태로 배치
    nodes.push({
      x: cx,
      y: cy,
      heading: Math.PI / 2, // 청중 방향
      detached: true,
      sitting: false,
      selected: false,
    });
    // 나머지 22명이 원을 이룸 (반시계 방향으로 진행, "왼쪽으로 돈다")
    const idealR = Math.min(stageW, stageH) * 0.36;
    const minR = (nodeCount - 1) * 32 / (2 * Math.PI); // MIN_NODE_GAP 적용
    const radius = Math.max(idealR, minR);
    // 시작 각도: 12시 방향에서 약간 오른쪽 (2번이 무대 뒤쪽 약간 우측)
    const startAngle = -Math.PI / 2 + 0.35;
    for (let i = 1; i < nodeCount; i++) {
      // 시계방향 배치 (번호 순서대로 오른쪽으로 내려가며 돌아옴)
      const angle = startAngle + (i - 1) * (2 * Math.PI / (nodeCount - 1));
      nodes.push({
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle),
        // 반시계 방향(왼쪽으로 돈다)으로 진행하는 접선 방향
        heading: angle - Math.PI / 2,
        detached: false,
        sitting: false,
        selected: false,
      });
    }
  } else {
    for (let i = 0; i < nodeCount; i++) {
      nodes.push({
        x: cx - (nodeCount/2 - i) * 25,
        y: cy,
        heading: 0,
        detached: false,
        sitting: false,
        selected: false,
      });
    }
  }
}

// 노드 수만 변경하되 기존 노드 위치는 유지
function resizeNodeCount(newCount) {
  if (newCount > nodes.length) {
    // 추가: 마지막 노드 뒤에 이어서 배치
    const last = nodes[nodes.length - 1] || {x: stageW/2, y: stageH/2, heading: 0};
    const prev = nodes[nodes.length - 2] || {x: last.x - 25, y: last.y, heading: 0};
    let dx = last.x - prev.x;
    let dy = last.y - prev.y;
    const mag = Math.sqrt(dx*dx + dy*dy) || 1;
    dx = dx / mag * 25;
    dy = dy / mag * 25;
    for (let i = nodes.length; i < newCount; i++) {
      const base = nodes[nodes.length - 1];
      nodes.push({
        x: base.x + dx,
        y: base.y + dy,
        heading: base.heading,
        detached: false,
        sitting: false,
        selected: false,
      });
    }
  } else if (newCount < nodes.length) {
    nodes = nodes.slice(0, newCount);
  }
  nodeCount = newCount;
}

function getInstrument(idx) {
  if (idx < INSTRUMENTS.length) return INSTRUMENTS[idx];
  return {name: `${idx+1}`, color: '#888'};
}

function drawGrid() {
  // 사각 격자 (중심 기준으로 고정 — 캔버스 크기가 변해도 격자가 중심에 정렬됨)
  ctx.strokeStyle = 'rgba(0,0,0,0.05)';
  ctx.lineWidth = 1;
  const gs = 40;
  const gcx = stageW / 2, gcy = stageH / 2;
  // 중심에서 좌우로 격자선
  for (let x = gcx % gs; x < stageW; x += gs) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, stageH); ctx.stroke();
  }
  for (let y = gcy % gs; y < stageH; y += gs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(stageW, y); ctx.stroke();
  }

  // 중심점
  const cx = stageW / 2;
  const cy = stageH / 2;
  const maxR = Math.sqrt(cx*cx + cy*cy);

  // 동심원 (원형 배치 가이드)
  ctx.strokeStyle = 'rgba(0,0,0,0.06)';
  ctx.lineWidth = 1;
  for (let r = gs; r < maxR; r += gs) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 방사선 (30도 간격)
  ctx.strokeStyle = 'rgba(0,0,0,0.04)';
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * maxR, cy + Math.sin(a) * maxR);
    ctx.stroke();
  }

  // 중심 십자선 (더 진하게)
  ctx.strokeStyle = 'rgba(232,69,96,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, stageH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(stageW, cy); ctx.stroke();

  // 중심점 마커
  ctx.fillStyle = 'rgba(232,69,96,0.5)';
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawPath() {
  if (path.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for (let i = 1; i < path.length; i++) {
    ctx.lineTo(path[i].x, path[i].y);
  }
  ctx.strokeStyle = 'rgba(232,69,96,0.3)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawConnectionLines() {
  const chain = getChainIndices(); // 체인 순서(인덱스)
  if (chain.length < 2) return;
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1.5;
  for (let i = 1; i < chain.length; i++) {
    const a = chain[i-1], b = chain[i];
    const key = Math.min(a,b) + '-' + Math.max(a,b);
    if (brokenLinks.has(key)) continue; // 끊긴 링크는 선 안 그림
    ctx.beginPath();
    ctx.moveTo(nodes[a].x, nodes[a].y);
    ctx.lineTo(nodes[b].x, nodes[b].y);
    ctx.stroke();
  }
}

function drawNodes() {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const inst = getInstrument(i);
    const baseR = i === 0 ? 16 : 13;
    const r = n.sitting ? Math.round(baseR * 0.72) : baseR;

    // 앉음 표시: 바닥 그림자
    if (n.sitting) {
      ctx.beginPath();
      ctx.ellipse(n.x, n.y + r + 3, r + 2, 2.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fill();
    }

    // 방향 삼각형 (앉으면 안 그림)
    if (!n.sitting) {
      const h = n.heading;
      const tipX = n.x + Math.cos(h) * (r + 8);
      const tipY = n.y + Math.sin(h) * (r + 8);
      const baseX = n.x + Math.cos(h) * (r - 1);
      const baseY = n.y + Math.sin(h) * (r - 1);
      const perpX = -Math.sin(h);
      const perpY = Math.cos(h);
      const tw = 5;
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(baseX + perpX * tw, baseY + perpY * tw);
      ctx.lineTo(baseX - perpX * tw, baseY - perpY * tw);
      ctx.closePath();
      ctx.fillStyle = inst.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 이탈 노드 외곽 점선 링
    if (n.detached) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(60,60,80,0.7)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 선택된 노드 강조 링 (노란색 실선, detached 링보다 더 바깥)
    if (n.selected) {
      const ringR = r + (n.detached ? 9 : 5);
      ctx.beginPath();
      ctx.arc(n.x, n.y, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffd60a';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // 노드 원 (앉으면 반투명한 색)
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    if (n.sitting) {
      // hex를 rgba로 낮춤
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = inst.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = inst.color;
      ctx.fill();
    }
    ctx.strokeStyle = n.detached ? '#fff' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = n.detached ? 2 : 1.5;
    ctx.stroke();

    ctx.fillStyle = n.sitting ? 'rgba(255,255,255,0.75)' : '#fff';
    const fontSize = (i === 0 ? 11 : 10) * (n.sitting ? 0.85 : 1);
    ctx.font = `bold ${Math.round(fontSize)}px 'Noto Sans KR', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(i + 1, n.x, n.y);
  }
}

let dragMode = null;
let dragChainOrder = [];
let dragStartPos = null;   // 체인 드래그 시작 위치 (sticky 판정용)
let stickyActive = false;  // 스냅된 원진에서 드래그 중, 아직 탈출 전
let stickyLastTheta = null; // 원진 회전 누적 각도 추적
let liveOrbit = null;       // 드래그 중 추정된 원 궤도 {cx, cy, radius, coverage}
let justEscaped = false;    // 방금 원진에서 탈출함 → 이번 드래그 종료 시 재스냅 억제

// 선택 및 lasso 관련 상태
let selectionRect = null;   // {startX, startY, endX, endY} — 드래그 중 사각형
let lassoAddMode = false;   // true면 기존 선택에 추가/토글, false면 새 선택

// ─── 노드 간 충돌(겹침) 해소 ───
// 시각적으로 노드끼리 딱 붙으면 더 이상 겹치지 않도록 서로 밀어냄.
// 달팽이진(나선)에서 안쪽·바깥쪽 노드가 겹치지 않고 나선이 유지되게 함.
let collisionEnabled = false;

function nodeCollisionRadius(idx) {
  // 시각 반지름 기반. 상쇠 16, 나머지 13. 약간의 여유 없이 딱 붙도록.
  const base = idx === 0 ? 16 : 13;
  const n = nodes[idx];
  const r = (n && n.sitting) ? Math.round(base * 0.72) : base;
  return r;
}

// 겹친 노드들을 서로 밀어내 겹침 제거. iterations번 반복해 안정화.
// fixedIdx: 이 인덱스의 노드는 밀리지 않음 (드래그 중인 head 등). null이면 모두 이동 가능.
function resolveCollisions(iterations, fixedIdx) {
  if (!collisionEnabled) return;
  const n = nodes.length;
  for (let iter = 0; iter < iterations; iter++) {
    let moved = false;
    for (let a = 0; a < n; a++) {
      for (let b = a + 1; b < n; b++) {
        const na = nodes[a], nb = nodes[b];
        const ra = nodeCollisionRadius(a);
        const rb = nodeCollisionRadius(b);
        const minDist = ra + rb;
        let dx = nb.x - na.x;
        let dy = nb.y - na.y;
        let dist = Math.hypot(dx, dy);
        if (dist >= minDist) continue;
        if (dist < 0.0001) {
          // 완전히 겹침 → 임의 방향으로 분리
          const ang = (a * 2.399963 + b * 0.7); // 유사난수 방향
          dx = Math.cos(ang); dy = Math.sin(ang); dist = 0.0001;
        }
        const overlap = minDist - dist;
        const ux = dx / dist, uy = dy / dist;
        // 두 노드를 겹친 만큼 서로 반대로 밀기
        const aFixed = (fixedIdx !== null && fixedIdx !== undefined && a === fixedIdx);
        const bFixed = (fixedIdx !== null && fixedIdx !== undefined && b === fixedIdx);
        if (aFixed && bFixed) continue;
        let pushA, pushB;
        if (aFixed) { pushA = 0; pushB = overlap; }
        else if (bFixed) { pushA = overlap; pushB = 0; }
        else {
          const [rA, rB] = pushRatios(a, b);
          pushA = overlap * rA;
          pushB = overlap * rB;
        }
        na.x -= ux * pushA; na.y -= uy * pushA;
        nb.x += ux * pushB; nb.y += uy * pushB;
        moved = true;
      }
    }
    // 캔버스 경계 안으로 클램프
    for (let i = 0; i < n; i++) {
      const r = nodeCollisionRadius(i);
      nodes[i].x = Math.max(r, Math.min(stageW - r, nodes[i].x));
      nodes[i].y = Math.max(r, Math.min(stageH - r, nodes[i].y));
    }
    if (!moved) break;
  }
}

// 노드 주변 혼잡도: 반경 crowdR 안의 다른 노드 수. 많을수록 빽빽(비킬 공간 적음).
function nodeCongestion(idx, crowdR) {
  const ni = nodes[idx];
  let count = 0;
  for (let j = 0; j < nodes.length; j++) {
    if (j === idx) continue;
    const dx = nodes[j].x - ni.x, dy = nodes[j].y - ni.y;
    if (dx*dx + dy*dy < crowdR*crowdR) count++;
  }
  return count;
}

// 두 노드의 혼잡도로 밀기 비율 결정.
// 덜 혼잡한(공간 넓은) 노드가 더 많이 비킴. 반환 [ratioA, ratioB], 합=1.
function pushRatios(a, b) {
  const crowdR = 45;
  const ca = nodeCongestion(a, crowdR);
  const cb = nodeCongestion(b, crowdR);
  // 혼잡한 쪽은 적게, 넓은 쪽은 많이 이동.
  // 노드 A가 더 혼잡(ca 큼)하면 A는 조금, B가 많이.
  const total = ca + cb;
  if (total === 0) return [0.5, 0.5];
  // A가 이동할 비율 = A가 덜 혼잡할수록 큼 = cb / total (상대 혼잡도)
  const ratioA = cb / total;
  const ratioB = ca / total;
  return [ratioA, ratioB];
}

function drawCrosshair() {
  if (dragMode !== 'chain' || path.length === 0) return;
  const last = path[path.length - 1];
  ctx.strokeStyle = 'rgba(232,69,96,0.5)';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(last.x, 0); ctx.lineTo(last.x, stageH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, last.y); ctx.lineTo(stageW, last.y); ctx.stroke();
  ctx.setLineDash([]);
}

function draw() {
  ctx.clearRect(0, 0, stageW, stageH);
  ctx.fillStyle = '#fafbfc';
  ctx.fillRect(0, 0, stageW, stageH);
  drawGrid();
  drawPath();
  drawConnectionLines();
  drawNodes();
  drawCrosshair();
  drawSelectionRect();
  drawShibilGuide();
  updateSelectionCount();
}

// 11자진 방향 가이드 (파워포인트 화살표 느낌).
// 첫 점 = 상쇠 쪽(줄 앞끝), 두 번째 점(커서) = 반대쪽. 커서 쪽에 화살촉.
function drawShibilGuide() {
  if (!shibilAimMode || !shibilAimP1 || !shibilAimCursor) return;
  const p1 = shibilAimP1, p2 = shibilAimCursor;
  ctx.save();
  ctx.strokeStyle = '#e94560';
  ctx.fillStyle = '#e94560';
  ctx.lineWidth = 2;
  // 선분
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
  ctx.setLineDash([]);
  // 첫 점(상쇠·막쇠 끝 방향): 큰 원 + 라벨
  ctx.beginPath(); ctx.arc(p1.x, p1.y, 6, 0, Math.PI*2); ctx.fill();
  ctx.font = "bold 11px 'Noto Sans KR', sans-serif";
  ctx.textAlign = 'center';
  ctx.fillText('상쇠·막쇠 끝', p1.x, p1.y - 12);
  // 두 번째 점(반대쪽): 화살촉
  const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
  const ah = 12;
  ctx.beginPath();
  ctx.moveTo(p2.x, p2.y);
  ctx.lineTo(p2.x - ah * Math.cos(ang - 0.4), p2.y - ah * Math.sin(ang - 0.4));
  ctx.lineTo(p2.x - ah * Math.cos(ang + 0.4), p2.y - ah * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawSelectionRect() {
  if (!selectionRect) return;
  const r = selectionRect;
  const x = Math.min(r.startX, r.endX);
  const y = Math.min(r.startY, r.endY);
  const w = Math.abs(r.endX - r.startX);
  const h = Math.abs(r.endY - r.startY);
  ctx.fillStyle = 'rgba(255, 214, 10, 0.10)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(255, 214, 10, 0.8)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]);
  ctx.strokeRect(x, y, w, h);
  ctx.setLineDash([]);
}

function getPointAtDistance(pts, dist) {
  if (pts.length === 0) return null;
  if (dist <= 0) return {...pts[pts.length - 1]};
  let accumulated = 0;
  for (let i = pts.length - 1; i > 0; i--) {
    const dx = pts[i].x - pts[i-1].x;
    const dy = pts[i].y - pts[i-1].y;
    const segLen = Math.sqrt(dx*dx + dy*dy);
    if (accumulated + segLen >= dist) {
      const t = (dist - accumulated) / segLen;
      return {
        x: pts[i].x - dx * t,
        y: pts[i].y - dy * t,
      };
    }
    accumulated += segLen;
  }
  return {...pts[0]};
}

function updateNodesFromPath() {
  if (path.length === 0 || dragChainOrder.length === 0) return;
  // 각 노드를 경로 상 위치에 배치 + 접선 방향 기록
  const tangents = {}; // nodeIdx → 접선 각도
  for (let i = 0; i < dragChainOrder.length; i++) {
    const nodeIdx = dragChainOrder[i];
    const pt = getPointAtDistance(path, i * spacing);
    if (pt) {
      const oldX = nodes[nodeIdx].x;
      const oldY = nodes[nodeIdx].y;
      const dx = pt.x - oldX;
      const dy = pt.y - oldY;
      if (dx*dx + dy*dy > 0.5) {
        nodes[nodeIdx].heading = Math.atan2(dy, dx);
      }
      nodes[nodeIdx].x = pt.x;
      nodes[nodeIdx].y = pt.y;
      tangents[nodeIdx] = nodes[nodeIdx].heading;
    }
  }
  // 라이브 궤도 스냅: 비활성화됨 (추후 개선 예정). 코드는 남겨둠.
  // applyLiveOrbitSnap();
  // 순서 유지 충돌 해소: 겹친 노드를 경로 접선에 수직(옆) 방향으로만 밀어냄.
  resolveCollisionsSideways(8, dragChainOrder[0], tangents);
}

// path(상쇠 궤적)로부터 원을 추정. 270°+ 호이면 {cx, cy, radius, coverage} 반환, 아니면 null.
function estimateOrbitFromPath() {
  if (path.length < 8) return null;
  // path 점들의 무게중심
  let cx = 0, cy = 0;
  for (const p of path) { cx += p.x; cy += p.y; }
  cx /= path.length; cy /= path.length;
  // 평균 반지름과 편차
  const dists = path.map(p => Math.hypot(p.x - cx, p.y - cy));
  const avg = dists.reduce((a, b) => a + b, 0) / dists.length;
  if (avg < 40) return null;
  const variance = dists.reduce((a, d) => a + (d - avg)*(d - avg), 0) / dists.length;
  const std = Math.sqrt(variance);
  if (std / avg > 0.32) return null; // 원에서 너무 벗어남
  // 커버리지(호의 중심각)
  const angles = path.map(p => Math.atan2(p.y - cy, p.x - cx)).sort((a, b) => a - b);
  let maxGap = 0;
  for (let i = 0; i < angles.length; i++) {
    const next = (i === angles.length - 1) ? angles[0] + Math.PI*2 : angles[i+1];
    maxGap = Math.max(maxGap, next - angles[i]);
  }
  const coverage = Math.PI*2 - maxGap;
  if (coverage < Math.PI * 270/180) return null;
  return { cx, cy, radius: avg, coverage };
}

// 상쇠가 원을 그리는 중이면, 상쇠는 궤도에 붙고 뒤 치배는 순차적으로 궤도에 올라옴.
function applyLiveOrbitSnap() {
  const orbit = estimateOrbitFromPath();
  if (!orbit) { liveOrbit = null; return; }
  liveOrbit = orbit;
  const { cx, cy, radius } = orbit;
  const order = dragChainOrder; // [0]=드래그 중(상쇠)
  const n = order.length;
  // 궤도 위 균등 배치 각도 간격
  const step = 2 * Math.PI / n;
  // 상쇠(드래그 노드)의 현재 각도를 기준으로
  const head = nodes[order[0]];
  const headAngle = Math.atan2(head.y - cy, head.x - cx);
  // 그린 방향 (path 각도 증분 부호)
  let angleSum = 0;
  for (let i = 1; i < path.length; i++) {
    let d = Math.atan2(path[i].y - cy, path[i].x - cx) - Math.atan2(path[i-1].y - cy, path[i-1].x - cx);
    while (d > Math.PI) d -= Math.PI*2;
    while (d < -Math.PI) d += Math.PI*2;
    angleSum += d;
  }
  const dir = angleSum >= 0 ? 1 : -1;

  // 각 노드를 "궤도 위 목표 위치"로 서서히 당김.
  // 앞 노드(상쇠에 가까울수록) 강하게, 뒤 노드는 약하게 → 순차적으로 올라옴.
  for (let i = 0; i < n; i++) {
    const idx = order[i];
    const targetAngle = headAngle + dir * i * step;
    const tx = cx + radius * Math.cos(targetAngle);
    const ty = cy + radius * Math.sin(targetAngle);
    // 당기는 강도: 상쇠(i=0)는 완전히(sticky), 뒤로 갈수록 약해져 서서히 올라옴
    // i=0: 1.0, 그 뒤 지수 감쇠
    const pull = i === 0 ? 1.0 : Math.max(0.12, Math.pow(0.82, i));
    nodes[idx].x += (tx - nodes[idx].x) * pull;
    nodes[idx].y += (ty - nodes[idx].y) * pull;
  }
}

// 경로 추적 중 순서 유지형 충돌: 겹침을 접선 수직 방향으로만 해소.
function resolveCollisionsSideways(iterations, fixedIdx, tangents) {
  if (!collisionEnabled) return;
  const n = nodes.length;
  for (let iter = 0; iter < iterations; iter++) {
    let moved = false;
    for (let a = 0; a < n; a++) {
      for (let b = a + 1; b < n; b++) {
        const na = nodes[a], nb = nodes[b];
        const ra = nodeCollisionRadius(a);
        const rb = nodeCollisionRadius(b);
        const minDist = ra + rb;
        let dx = nb.x - na.x, dy = nb.y - na.y;
        let dist = Math.hypot(dx, dy);
        if (dist >= minDist) continue;
        if (dist < 0.0001) { dx = 1; dy = 0; dist = 0.0001; }
        const overlap = minDist - dist;
        // 두 노드의 접선 평균에 수직인 방향으로 밀기 (경로 진행 방향과 직교)
        let tA = tangents[a], tB = tangents[b];
        let pushAngle;
        if (tA !== undefined || tB !== undefined) {
          const t = (tA !== undefined ? tA : tB);
          // 접선에 수직 = t + 90°
          pushAngle = t + Math.PI / 2;
        } else {
          pushAngle = Math.atan2(dy, dx);
        }
        // 밀기 축: 접선 수직 방향. 바깥(중심에서 먼 쪽)을 + 방향으로 정렬.
        let ux = Math.cos(pushAngle), uy = Math.sin(pushAngle);
        const midX = (na.x + nb.x) / 2, midY = (na.y + nb.y) / 2;
        const outX = midX - stageW/2, outY = midY - stageH/2;
        if (ux * outX + uy * outY < 0) { ux = -ux; uy = -uy; }
        // +ux 방향 = 바깥. 두 노드 중 중심에서 더 먼 노드를 바깥(+)으로 보냄.
        const distA = Math.hypot(na.x - stageW/2, na.y - stageH/2);
        const distB = Math.hypot(nb.x - stageW/2, nb.y - stageH/2);
        // outerNode = 바깥으로 갈 노드, innerNode = 안으로 갈 노드
        let outerIsB = distB >= distA;
        const aFixed = (fixedIdx != null && a === fixedIdx);
        const bFixed = (fixedIdx != null && b === fixedIdx);
        if (aFixed && bFixed) continue;
        // 혼잡도 기반 이동량 비율
        let pushOuter, pushInner;
        if (aFixed || bFixed) {
          // 고정 노드는 안 움직임
          if (aFixed) { // a 고정 → b가 전부 이동
            if (outerIsB) { nb.x += ux*overlap; nb.y += uy*overlap; }
            else { nb.x -= ux*overlap; nb.y -= uy*overlap; }
          } else { // b 고정 → a가 전부 이동
            if (outerIsB) { na.x -= ux*overlap; na.y -= uy*overlap; }
            else { na.x += ux*overlap; na.y += uy*overlap; }
          }
          moved = true;
          continue;
        }
        const [rA, rB] = pushRatios(a, b);
        const pushA = overlap * rA;
        const pushB = overlap * rB;
        // 바깥 노드는 +ux, 안 노드는 -ux
        if (outerIsB) {
          nb.x += ux * pushB; nb.y += uy * pushB;
          na.x -= ux * pushA; na.y -= uy * pushA;
        } else {
          na.x += ux * pushA; na.y += uy * pushA;
          nb.x -= ux * pushB; nb.y -= uy * pushB;
        }
        moved = true;
      }
    }
    for (let i = 0; i < n; i++) {
      const r = nodeCollisionRadius(i);
      nodes[i].x = Math.max(r, Math.min(stageW - r, nodes[i].x));
      nodes[i].y = Math.max(r, Math.min(stageH - r, nodes[i].y));
    }
    if (!moved) break;
  }
}

function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height),
  };
}

function findNodeAt(pos) {
  for (let i = 0; i < nodes.length; i++) {
    const dx = nodes[i].x - pos.x;
    const dy = nodes[i].y - pos.y;
    if (Math.sqrt(dx*dx + dy*dy) < 18) return i;
  }
  return -1;
}

let lastClickTime = 0;
let mouseDownInfo = null; // 짧은 클릭 감지용 {x, y, t, nodeIdx, moved}
let ctxMenuNodeIdx = -1;  // 우클릭 컨텍스트 메뉴 대상 노드
let shibilAimMode = false; // 11자진 방향 설정 모드
let shibilAimP1 = null;    // 첫 클릭 지점 {x, y}
let shibilAimCursor = null; // 현재 커서 위치 (가이드 선용)
let lastClickNodeIdx = -1;

function getChainIndices(excludeIdx) {
  const result = [];
  for (let i = 0; i < nodes.length; i++) {
    if (nodes[i].detached) continue;
    if (excludeIdx !== undefined && i === excludeIdx) continue;
    result.push(i);
  }
  return result;
}

// 전체 체인을 brokenLinks 경계로 나눈 세그먼트 목록 반환. 각 세그먼트는 인덱스 배열.
// 센티피드처럼 끊긴 지점에서 독립된 체인 조각이 됨.
function getChainSegments() {
  const chain = getChainIndices();
  if (chain.length === 0) return [];
  const segments = [];
  let cur = [chain[0]];
  for (let i = 1; i < chain.length; i++) {
    const a = chain[i-1], b = chain[i];
    const key = Math.min(a,b) + '-' + Math.max(a,b);
    if (brokenLinks.has(key)) {
      segments.push(cur);
      cur = [b];
    } else {
      cur.push(b);
    }
  }
  segments.push(cur);
  return segments;
}

// 특정 노드가 속한 세그먼트를 반환. 없으면 빈 배열.
function getSegmentOf(nodeIdx) {
  const segs = getChainSegments();
  for (const s of segs) {
    if (s.includes(nodeIdx)) return s;
  }
  return [];
}

function tryReattach(nodeIdx) {
  const n = nodes[nodeIdx];
  const chain = getChainIndices(nodeIdx);
  if (chain.length === 0) return false;
  const head = nodes[chain[0]];
  const tail = nodes[chain[chain.length - 1]];
  const dh = Math.hypot(n.x - head.x, n.y - head.y);
  const dt = Math.hypot(n.x - tail.x, n.y - tail.y);
  const threshold = spacing * 1.8;
  if (dh < threshold || dt < threshold) {
    n.detached = false;
    return true;
  }
  return false;
}

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('mousedown', (e) => {
  const pos = getMousePos(e);

  // 11자진 방향 설정 모드: 두 점 클릭으로 방향선 확정
  if (shibilAimMode) {
    if (e.button === 2) {
      // 우클릭 → 취소
      shibilAimMode = false;
      shibilAimP1 = null;
      shibilAimCursor = null;
      canvas.style.cursor = 'default';
      draw();
      showToast('11자진 방향 설정 취소');
      return;
    }
    if (e.button !== 0) return; // 좌클릭만
    if (!shibilAimP1) {
      // 첫 클릭 → 시작점 고정
      shibilAimP1 = { x: pos.x, y: pos.y };
      shibilAimCursor = { x: pos.x, y: pos.y };
      showToast('11자진 방향: 두 번째 점을 클릭하면 그 방향과 평행하게 만듭니다');
    } else {
      // 두 번째 클릭 → 선분 확정, 그 방향으로 11자진
      const dx = pos.x - shibilAimP1.x;
      const dy = pos.y - shibilAimP1.y;
      if (dx*dx + dy*dy < 25) {
        // 너무 짧으면 무시하고 계속 대기
        return;
      }
      saveUndo();
      snappedCircle = null;
      // 선분 방향 = 줄이 뻗는 축. 상쇠 줄 앞끝 = 첫 클릭 지점.
      // 화살표 방향 = 축(상쇠끝→중간끝). 위치는 진 자체 기하로 결정.
      animateToShibiljajin(dx, dy);
      // 모드 종료, 가이드 선 제거
      shibilAimMode = false;
      shibilAimP1 = null;
      shibilAimCursor = null;
      canvas.style.cursor = 'default';
      draw();
    }
    return;
  }

  // 짧은 클릭 감지용: 시작 위치·시간·대상 노드·Ctrl 기록
  mouseDownInfo = { x: pos.x, y: pos.y, t: Date.now(), nodeIdx: findNodeAt(pos), moved: false, ctrl: !!(e.ctrlKey || e.metaKey) };

  // 우클릭: 노드 위면 컨텍스트 패널 표시
  if (e.button === 2) {
    const idx = findNodeAt(pos);
    if (idx >= 0) {
      ctxMenuNodeIdx = idx;
      const rect = canvas.getBoundingClientRect();
      const menu = document.getElementById('ctxMenu');
      // 캔버스 프레임 기준 위치 (마우스 지점)
      menu.style.left = (pos.x * rect.width / canvas.width) + 'px';
      menu.style.top = (pos.y * rect.height / canvas.height) + 'px';
      menu.classList.add('show');
    }
    return;
  }

  // shift+클릭: 해당 노드의 앉음/일어남 토글
  if (e.shiftKey) {
    const idx = findNodeAt(pos);
    if (idx >= 0) {
      saveUndo();
      nodes[idx].sitting = !nodes[idx].sitting;
      draw();
      showToast(nodes[idx].sitting ? `${idx + 1}번 앉음` : `${idx + 1}번 일어섬`);
    }
    return;
  }

  const now = Date.now();
  const hoveredIdx = findNodeAt(pos);

  // 더블클릭 → 그 노드를 선택 + 분리(detached)해서 개별 이동 가능하게
  if (hoveredIdx >= 0 && hoveredIdx === lastClickNodeIdx && now - lastClickTime < 350) {
    saveUndo();
    for (const n of nodes) n.selected = false;
    nodes[hoveredIdx].selected = true;
    nodes[hoveredIdx].detached = true;
    dragMode = 'individual';
    dragNodeIdx = hoveredIdx;
    dragChainOrder = [];
    canvas.style.cursor = 'grabbing';
    lastClickTime = 0;
    lastClickNodeIdx = -1;
    mouseDownInfo = null; // 더블클릭 처리했으므로 클릭 재판정 방지
    draw();
    showToast(`${hoveredIdx + 1}번 분리 (개별 이동 가능)`);
    return;
  }
  lastClickTime = now;
  lastClickNodeIdx = hoveredIdx;

  // 빈 공간 클릭 → lasso 선택 시작 (Ctrl 눌러 있으면 기존 선택에 추가)
  if (hoveredIdx < 0) {
    dragMode = 'lasso';
    lassoAddMode = !!(e.ctrlKey || e.metaKey);
    selectionRect = { startX: pos.x, startY: pos.y, endX: pos.x, endY: pos.y };
    // 추가 모드가 아니면 기존 선택 즉시 해제 (드래그 없이 그냥 클릭 = 전체 해제)
    if (!lassoAddMode) {
      for (const n of nodes) n.selected = false;
    }
    canvas.style.cursor = 'crosshair';
    draw();
    return;
  }

  const node = nodes[hoveredIdx];

  // 분리된 노드 클릭 → 개별 이동
  if (node.detached) {
    saveUndo();
    dragMode = 'individual';
    dragNodeIdx = hoveredIdx;
    dragChainOrder = [];
    canvas.style.cursor = 'grabbing';
    return;
  }

  // 체인 내 노드: 클릭한 노드가 속한 세그먼트의 선두/후미만 드래그 가능
  const segment = getSegmentOf(hoveredIdx);
  if (segment.length === 0) { dragMode = null; return; }
  const headIdx = segment[0];
  const tailIdx = segment[segment.length - 1];

  if (hoveredIdx === headIdx) {
    saveUndo();
    dragMode = 'chain';
    dragChainOrder = segment; // 선두 → 후미
    path = [];
    for (let i = segment.length - 1; i >= 0; i--) {
      path.push({x: nodes[segment[i]].x, y: nodes[segment[i]].y});
    }
    dragStartPos = { x: pos.x, y: pos.y };
    stickyActive = (snappedCircle !== null);
    stickyLastTheta = null;
    canvas.style.cursor = 'grabbing';
  } else if (hoveredIdx === tailIdx) {
    saveUndo();
    dragMode = 'chain';
    dragChainOrder = segment.slice().reverse(); // 후미 → 선두
    path = [];
    for (let i = 0; i < segment.length; i++) {
      path.push({x: nodes[segment[i]].x, y: nodes[segment[i]].y});
    }
    dragStartPos = { x: pos.x, y: pos.y };
    stickyActive = (snappedCircle !== null);
    stickyLastTheta = null;
    canvas.style.cursor = 'grabbing';
  } else {
    // 세그먼트 중간 노드 → 움직이지 않음 (양 끝만 핸들)
    dragMode = null;
  }
  // 녹화 중이고 드래그가 시작됐으면 클립 시작
  if (isRecording && (dragMode === 'chain' || dragMode === 'individual' || dragMode === 'rotate')) {
    recordClipStart();
  }
});

canvas.addEventListener('mousemove', (e) => {
  const pos = getMousePos(e);
  // 11자진 방향 모드: 첫 점이 찍혔으면 커서까지 가이드 선을 그림
  if (shibilAimMode && shibilAimP1) {
    shibilAimCursor = { x: pos.x, y: pos.y };
    draw();
    return;
  }
  // 이동 감지 (짧은 클릭 판정용): 시작점에서 일정 이상 움직이면 드래그로 간주
  if (mouseDownInfo && !mouseDownInfo.moved) {
    const mdx = pos.x - mouseDownInfo.x, mdy = pos.y - mouseDownInfo.y;
    if (mdx*mdx + mdy*mdy > 25) {
      mouseDownInfo.moved = true; // 5px 이상 = 드래그 확정
      // 드래그(체인/개별/회전)를 시작하면 기존 선택을 해제.
      // 라쏘(빈 공간 선택 드래그)는 제외.
      if (dragMode === 'chain' || dragMode === 'individual' || dragMode === 'rotate') {
        for (const n of nodes) n.selected = false;
      }
    }
  }
  if (dragMode === 'lasso') {
    selectionRect.endX = pos.x;
    selectionRect.endY = pos.y;
    draw();
    return;
  }
  if (dragMode === 'rotate') {
    const n = nodes[dragNodeIdx];
    const dx = pos.x - n.x;
    const dy = pos.y - n.y;
    if (dx*dx + dy*dy > 4) {
      n.heading = Math.atan2(dy, dx);
      draw();
    }
    recordFrame();
    return;
  }
  if (dragMode === 'individual') {
    nodes[dragNodeIdx].x = pos.x;
    nodes[dragNodeIdx].y = pos.y;
    snappedCircle = null; // 개별 노드를 옮기면 원진 상태 해제
    // 충돌 해소: 드래그 중인 노드는 고정, 나머지가 밀려남
    resolveCollisions(6, dragNodeIdx);
    draw();
    recordFrame();
    return;
  }
  if (dragMode === 'chain') {
    // sticky 스냅: 스냅된 원진에서 궤도(반지름)를 벗어나야 탈출. 궤도 위 회전은 유지.
    if (stickyActive && snappedCircle) {
      const { cx, cy, radius } = snappedCircle;
      // 마우스가 원 중심에서 떨어진 거리 = 현재 반지름
      const curR = Math.hypot(pos.x - cx, pos.y - cy);
      const RADIAL_THRESHOLD = 40; // 궤도에서 반지름 방향으로 이만큼 벗어나면 탈출
      if (Math.abs(curR - radius) < RADIAL_THRESHOLD) {
        // 궤도 근처 → 회전만. 잡은 지점의 각도 변화만큼 원진 전체 회전.
        const angleNow = Math.atan2(pos.y - cy, pos.x - cx);
        const angleStart = Math.atan2(dragStartPos.y - cy, dragStartPos.x - cx);
        let dTheta = normAngle(angleNow - angleStart);
        if (stickyLastTheta === null) stickyLastTheta = 0;
        const dInc = dTheta - stickyLastTheta;
        stickyLastTheta = dTheta;
        const cos = Math.cos(dInc), sin = Math.sin(dInc);
        snappedCircle.group.forEach(i => {
          const rx = nodes[i].x - cx, ry = nodes[i].y - cy;
          nodes[i].x = cx + rx * cos - ry * sin;
          nodes[i].y = cy + rx * sin + ry * cos;
        });
        draw();
        recordFrame();
        return;
      }
      // 반지름 방향으로 크게 벗어남 → 탈출
      stickyActive = false;
      snappedCircle = null;
      stickyLastTheta = null;
      justEscaped = true;
      showToast('원진 탈출');
    }
    const last = path[path.length - 1];
    const dx = pos.x - last.x;
    const dy = pos.y - last.y;
    if (dx*dx + dy*dy > 9) {
      path.push({x: pos.x, y: pos.y});
      updateNodesFromPath();
      draw();
    }
    recordFrame();
    return;
  }
  // hover cursor
  canvas.style.cursor = findNodeAt(pos) >= 0 ? 'grab' : 'default';
});

canvas.addEventListener('mouseup', (e) => {
  // 짧은 클릭 감지: 노드 위에서 눌렀고, 거의 안 움직였고, 짧은 시간이면 → 단일 노드 선택
  // (중간 노드는 dragMode가 null이라도 클릭 선택은 되어야 함)
  if (mouseDownInfo && mouseDownInfo.nodeIdx >= 0 && !mouseDownInfo.moved
      && (Date.now() - mouseDownInfo.t) < 300
      && dragMode !== 'lasso' && dragMode !== 'rotate') {
    if (isRecording && currentClip) { currentClip = null; }
    const clickedIdx = mouseDownInfo.nodeIdx;
    const additive = !!(mouseDownInfo.ctrl);
    if (additive) {
      nodes[clickedIdx].selected = !nodes[clickedIdx].selected;
    } else {
      for (const n of nodes) n.selected = false;
      nodes[clickedIdx].selected = true;
    }
    const selN = nodes.filter(n => n.selected).length;
    showToast(`${selN}명 선택됨`);
    dragMode = null;
    dragNodeIdx = -1;
    dragChainOrder = [];
    path = [];
    stickyActive = false;
    mouseDownInfo = null;
    canvas.style.cursor = 'default';
    draw();
    return;
  }

  if (dragMode === 'lasso') {
    // 사각형 확정 → 그 안의 노드들을 선택 처리
    const r = selectionRect;
    const xmin = Math.min(r.startX, r.endX);
    const xmax = Math.max(r.startX, r.endX);
    const ymin = Math.min(r.startY, r.endY);
    const ymax = Math.max(r.startY, r.endY);
    const isDrag = (xmax - xmin) > 3 || (ymax - ymin) > 3;

    if (isDrag) {
      // 드래그 경우: 사각형 안 노드 처리
      let hitCount = 0;
      for (const n of nodes) {
        const inside = n.x >= xmin && n.x <= xmax && n.y >= ymin && n.y <= ymax;
        if (inside) {
          if (lassoAddMode) n.selected = !n.selected;  // Ctrl+드래그: 토글
          else n.selected = true;                        // 일반 드래그: 선택
          if (n.selected) hitCount++;
        }
      }
      const total = nodes.filter(n => n.selected).length;
      if (total > 0) showToast(`${total}명 선택됨`);
    }
    // 클릭만 한 경우(드래그 없음)는 위 mousedown에서 이미 전체 해제 처리됨

    selectionRect = null;
    dragMode = null;
    dragNodeIdx = -1;
    dragChainOrder = [];
    canvas.style.cursor = 'default';
    draw();
    return;
  }

  if (dragMode === 'individual') {
    const idx = dragNodeIdx;
    if (idx >= 0 && nodes[idx].detached) {
      if (tryReattach(idx)) showToast('진형에 재연결되었습니다');
    }
  }
  const wasChain = (dragMode === 'chain');
  const wasSticky = stickyActive; // 회전만 하고 탈출 안 한 경우
  const wasJustEscaped = justEscaped;
  const draggedSeg = dragChainOrder.slice(); // 방금 드래그한 세그먼트 (역순일 수 있음)
  dragMode = null;
  dragNodeIdx = -1;
  dragChainOrder = [];
  path = [];
  stickyActive = false;
  stickyLastTheta = null;
  justEscaped = false;
  liveOrbit = null;
  canvas.style.cursor = 'default';
  if (wasChain && wasSticky) {
    // 회전만 함: 원진 상태(snappedCircle) 그대로 유지 — 별도 처리 없음
  } else if (wasChain && !wasJustEscaped && autoSnapEnabled && draggedSeg.length >= 5 && isCircleSnappable(draggedSeg)) {
    snapToCircle(draggedSeg);
  }
  // 녹화: 이 드래그 동작을 하나의 클립으로 마감
  if (isRecording) finishClip();
  mouseDownInfo = null;
  draw();
});

canvas.addEventListener('mouseleave', () => {
  if (dragMode === 'lasso') {
    selectionRect = null;
    dragMode = null;
    canvas.style.cursor = 'default';
    draw();
    return;
  }
  if (dragMode === 'individual' && dragNodeIdx >= 0 && nodes[dragNodeIdx].detached) {
    tryReattach(dragNodeIdx);
  }
  dragMode = null;
  dragNodeIdx = -1;
  dragChainOrder = [];
  path = [];
  liveOrbit = null;
  stickyActive = false;
  canvas.style.cursor = 'default';
  draw();
});

// Touch support
function touchPos(e) {
  const touch = e.touches[0] || e.changedTouches[0];
  const rect = canvas.getBoundingClientRect();
  return {
    x: (touch.clientX - rect.left) * (canvas.width / rect.width),
    y: (touch.clientY - rect.top) * (canvas.height / rect.height),
  };
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const pos = touchPos(e);
  const now = Date.now();
  const hoveredIdx = findNodeAt(pos);

  if (hoveredIdx >= 0 && hoveredIdx === lastClickNodeIdx && now - lastClickTime < 400) {
    saveUndo();
    nodes[hoveredIdx].detached = !nodes[hoveredIdx].detached;
    dragMode = 'individual';
    dragNodeIdx = hoveredIdx;
    dragChainOrder = [];
    lastClickTime = 0;
    lastClickNodeIdx = -1;
    draw();
    return;
  }
  lastClickTime = now;
  lastClickNodeIdx = hoveredIdx;

  if (hoveredIdx < 0) { dragMode = null; return; }
  const node = nodes[hoveredIdx];
  if (node.detached) {
    saveUndo();
    dragMode = 'individual';
    dragNodeIdx = hoveredIdx;
    dragChainOrder = [];
    return;
  }
  const chain = getChainIndices();
  if (chain.length === 0) { dragMode = null; return; }
  const headIdx = chain[0];
  const tailIdx = chain[chain.length - 1];
  if (hoveredIdx === headIdx) {
    saveUndo();
    dragMode = 'chain';
    dragChainOrder = chain;
    path = [];
    for (let i = chain.length - 1; i >= 0; i--) path.push({x: nodes[chain[i]].x, y: nodes[chain[i]].y});
  } else if (hoveredIdx === tailIdx) {
    saveUndo();
    dragMode = 'chain';
    dragChainOrder = chain.slice().reverse();
    path = [];
    for (let i = 0; i < chain.length; i++) path.push({x: nodes[chain[i]].x, y: nodes[chain[i]].y});
  } else {
    dragMode = null;
  }
}, {passive: false});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const pos = touchPos(e);
  if (dragMode === 'individual') {
    nodes[dragNodeIdx].x = pos.x;
    nodes[dragNodeIdx].y = pos.y;
    draw();
    return;
  }
  if (dragMode === 'chain') {
    const last = path[path.length - 1];
    const dx = pos.x - last.x;
    const dy = pos.y - last.y;
    if (dx*dx + dy*dy > 9) {
      path.push({x: pos.x, y: pos.y});
      updateNodesFromPath();
      draw();
    }
  }
}, {passive: false});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (dragMode === 'individual' && dragNodeIdx >= 0 && nodes[dragNodeIdx].detached) {
    if (tryReattach(dragNodeIdx)) showToast('진형에 재연결되었습니다');
  }
  dragMode = null;
  dragNodeIdx = -1;
  dragChainOrder = [];
  path = [];
  draw();
}, {passive: false});

// Undo
function saveUndo() {
  undoStack.push(nodes.map(n => ({...n})));
  if (undoStack.length > 50) undoStack.shift();
}

document.getElementById('btnUndo').addEventListener('click', () => {
  if (undoStack.length === 0) return;
  nodes = undoStack.pop();
  path = [];
  draw();
});

// Controls
document.getElementById('nodeCount').addEventListener('change', (e) => {
  const newCount = Math.max(1, Math.min(50, parseInt(e.target.value) || 23));
  e.target.value = newCount;
  resizeNodeCount(newCount);
  path = [];
  draw();
});

const spacingSlider = document.getElementById('spacing');
spacingSlider.addEventListener('input', (e) => {
  spacing = parseInt(e.target.value);
  document.getElementById('spacingVal').textContent = spacing;
  if (path.length > 0) {
    updateNodesFromPath();
    draw();
  }
});

// 참고: 간격 슬라이더 값이 곧 목표 간격. 실제 노드 간격으로 덮어쓰지 않는다
// (체인을 움직이면 뒤 노드가 슬라이더 간격으로 서서히 수렴).

// Save keyframe
function saveKeyframe(nameOverride) {
  const kf = {
    name: nameOverride || `진형 ${keyframes.length + 1}`,
    nodes: nodes.map((n, i) => ({
      x: Math.round(n.x * 100 / stageW) / 100,
      y: Math.round(n.y * 100 / stageH) / 100,
      px: Math.round(n.x),
      py: Math.round(n.y),
      heading: Math.round(n.heading * 1000) / 1000,
      detached: !!n.detached,
      sitting: !!n.sitting,
      instrument: getInstrument(i).name,
    })),
    timestamp: Date.now(),
  };
  keyframes.push(kf);
  activeKeyframe = keyframes.length - 1;
  renderKeyframes();
  showCoords(activeKeyframe);
}

document.getElementById('btnSave').addEventListener('click', () => {
  saveKeyframe();
  showToast('키프레임이 저장되었습니다!');
});

// Recording
let isRecording = false;
// 동작 기반 녹화: 각 드래그(mousedown~up)가 하나의 클립. 클립은 프레임 궤적의 배열.
// clip = {frames: [snapshot, ...], times: [ms, ...]}. times[k] = 클립 시작 후 k번째 프레임의 경과 시간(ms).
// snapshot = [{x,y,heading,detached,sitting}, ...]
let recordedClips = [];
let currentClip = null;   // 녹화 중인 현재 드래그의 클립
let lastSnapshotTime = 0;
let clipStartTime = 0;

function nodeSnapshot() {
  return nodes.map(n => ({
    x: n.x, y: n.y, heading: n.heading,
    detached: !!n.detached, sitting: !!n.sitting
  }));
}

document.getElementById('btnRecord').addEventListener('click', () => {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
});

function startRecording() {
  isRecording = true;
  // 기존 클립은 지우지 않고 뒤에 이어붙임 (불러온 기록에 이어서 녹화 가능). 삭제는 목록의 ✕로.
  currentClip = null;
  const btn = document.getElementById('btnRecord');
  btn.classList.add('recording');
  btn.textContent = '⏹ 녹화 중지';
  showToast(recordedClips.length
    ? `녹화 시작 — 기존 ${recordedClips.length}개 동작 뒤에 이어서 기록합니다`
    : '녹화 시작 — 노드를 드래그하면 그대로 기록됩니다');
  renderKeyframes();
}

function stopRecording() {
  isRecording = false;
  if (currentClip) { finishClip(); }
  const btn = document.getElementById('btnRecord');
  btn.classList.remove('recording');
  btn.textContent = '⏺ 녹화';
  showToast(`녹화 종료 — ${recordedClips.length}개 동작 기록됨`);
  renderKeyframes();
}

// 드래그 시작 시 호출: 새 클립 시작, 시작 상태 캡처
function recordClipStart() {
  if (!isRecording) return;
  clipStartTime = performance.now();
  lastSnapshotTime = clipStartTime;
  currentClip = { frames: [ nodeSnapshot() ], times: [0] };
}

// 드래그 중 매 이동 시 호출: 프레임 캡처 (과도한 캡처 방지 위해 최소 시간 간격)
function recordFrame() {
  if (!isRecording || !currentClip) return;
  const now = performance.now();
  if (now - lastSnapshotTime < 16) return; // 약 60fps 상한
  lastSnapshotTime = now;
  currentClip.frames.push(nodeSnapshot());
  currentClip.times.push(Math.round(now - clipStartTime));
}

// 드래그 종료 시 호출: 클립 마감
function finishClip() {
  if (!currentClip) return;
  // 종료 상태 캡처
  currentClip.frames.push(nodeSnapshot());
  currentClip.times.push(Math.round(performance.now() - clipStartTime));
  // 프레임이 2개 이상일 때만 유효한 동작으로 저장
  if (currentClip.frames.length >= 2) {
    recordedClips.push(currentClip);
    renderKeyframes();
  }
  currentClip = null;
}

// 최소 간격: 노드끼리 물리적으로 겹치지 않는 최소 중심 간 거리
const MIN_NODE_GAP = 32; // px (노드 반지름 13*2 + 여유 6)

// 원진 스냅: 드래그한 체인 노드를 완벽한 원으로 부드럽게 재배치.
// 체인 순서와 그린 방향(시계/반시계)을 유지. 그린 궤도 반지름을 유지하고 균등 배치.
function snapToCircle(indicesOverride) {
  const group = (indicesOverride && indicesOverride.length) ? indicesOverride : getChainIndices();
  if (group.length < 3) return;
  saveUndo();
  // 무게중심
  let cx = 0, cy = 0;
  group.forEach(i => { cx += nodes[i].x; cy += nodes[i].y; });
  cx /= group.length; cy /= group.length;
  // 그린 궤도의 평균 반지름
  let radius = 0;
  group.forEach(i => { radius += Math.hypot(nodes[i].x - cx, nodes[i].y - cy); });
  radius /= group.length;
  const hardMin = MIN_NODE_GAP;
  if (radius < hardMin) radius = hardMin;
  const maxR = Math.min(stageW, stageH) * 0.46;
  if (radius > maxR) radius = maxR;

  // 첫 노드(상쇠)의 현재 각도를 시작점으로
  const first = nodes[group[0]];
  const startAngle = Math.atan2(first.y - cy, first.x - cx);

  // 그린 방향 판정: 체인 앞부분의 각도 변화 부호로 결정.
  // 여러 구간의 각도 증분을 합산 (노이즈 완화).
  let angleSum = 0;
  for (let i = 1; i < group.length; i++) {
    const aPrev = Math.atan2(nodes[group[i-1]].y - cy, nodes[group[i-1]].x - cx);
    const aCur  = Math.atan2(nodes[group[i]].y - cy, nodes[group[i]].x - cx);
    angleSum += normAngle(aCur - aPrev);
  }
  // angleSum > 0 이면 각도 증가 방향으로 그림, < 0 이면 감소 방향
  const dir = angleSum >= 0 ? 1 : -1;

  const step = 2 * Math.PI / group.length;
  // 목표 위치 계산 (순서 i 유지, 그린 방향 dir 유지). heading은 건드리지 않음.
  const targetX = {}, targetY = {};
  for (let i = 0; i < group.length; i++) {
    const angle = startAngle + dir * i * step;
    targetX[group[i]] = cx + radius * Math.cos(angle);
    targetY[group[i]] = cy + radius * Math.sin(angle);
  }

  // 부드러운 애니메이션 (위치만)
  const startX = {}, startY = {};
  group.forEach(i => { startX[i] = nodes[i].x; startY[i] = nodes[i].y; });
  const duration = 500;
  const t0 = performance.now();
  function step_(now){
    const t = Math.min(1, (now - t0)/duration);
    const e = easeInOut(t);
    group.forEach(i => {
      nodes[i].x = startX[i] + (targetX[i]-startX[i])*e;
      nodes[i].y = startY[i] + (targetY[i]-startY[i])*e;
    });
    draw();
    if (t < 1) requestAnimationFrame(step_);
    else {
      // 스냅된 원의 둘레 간격을 슬라이더에 반영 (큰 원이면 간격이 넓어짐)
      const arcSpacing = Math.round(2 * Math.PI * radius / group.length);
      spacing = arcSpacing;
      const sv = Math.max(30, Math.min(arcSpacing, 150));
      spacingSlider.max = Math.max(150, arcSpacing + 20);
      spacingSlider.value = sv;
      document.getElementById('spacingVal').textContent = arcSpacing;
      // sticky 스냅 상태 기록
      snappedCircle = { cx, cy, radius, group: group.slice() };
      showToast(`원진 스냅 (${group.length}명, 반지름 ${Math.round(radius)}px, 간격 ${arcSpacing}px)`);
    }
  }
  requestAnimationFrame(step_);
}

// 체인 전체 방향 회전
function rotateAll(delta) {
  saveUndo();
  const chain = getChainIndices();
  chain.forEach(i => {
    nodes[i].heading = normAngle(nodes[i].heading + delta);
  });
  draw();
}

// 자동 스냅 켜짐 여부
let autoSnapEnabled = true;
// sticky 스냅 상태: 스냅된 원진 정보 {cx, cy, radius, group}
let snappedCircle = null;
// 끊긴 체인 링크 집합. 'loIdx-hiIdx' 문자열 (체인상 인접한 두 노드 사이 연결이 끊김)
let brokenLinks = new Set();

// 원진 스냅 가능 판정 (드래그 종료 시 자동 스냅용).
// 체인의 head(맨앞)와 tail(맨뒤)이 닿아 원이 닫히면 관대하게(찌그러진 원도) 판정.
function isCircleSnappable(groupOverride) {
  const chain = (groupOverride && groupOverride.length) ? groupOverride.slice() : getChainIndices();
  if (chain.length < 5) return false;
  let cx = 0, cy = 0;
  chain.forEach(i => { cx += nodes[i].x; cy += nodes[i].y; });
  cx /= chain.length; cy /= chain.length;
  const dists = chain.map(i => Math.hypot(nodes[i].x - cx, nodes[i].y - cy));
  const avg = dists.reduce((a, b) => a + b, 0) / dists.length;
  if (avg < 40) return false;
  const variance = dists.reduce((a, d) => a + (d - avg) * (d - avg), 0) / dists.length;
  const std = Math.sqrt(variance);

  // head-tail 근접 여부: 맨 앞·맨 뒤 노드가 가까우면 원이 닫힘
  const head = nodes[chain[0]], tail = nodes[chain[chain.length - 1]];
  const headTailDist = Math.hypot(head.x - tail.x, head.y - tail.y);
  const closed = headTailDist < avg * 0.9;

  const angles = chain.map(i => Math.atan2(nodes[i].y - cy, nodes[i].x - cx)).sort((a, b) => a - b);
  let maxGap = 0;
  for (let i = 0; i < angles.length; i++) {
    const next = (i === angles.length - 1) ? angles[0] + Math.PI * 2 : angles[i + 1];
    maxGap = Math.max(maxGap, next - angles[i]);
  }

  if (closed) {
    if (std / avg > 0.32) return false;
    if (maxGap > Math.PI * 100/180) return false;
    return true;
  }
  if (std / avg > 0.16) return false;
  if (maxGap > Math.PI * 75/180) return false;
  return true;
}

// 11자진 애니메이션. axisX/Y = 두 줄이 뻗어나가는 축 방향(화살표 방향).
// 화살표 첫 점 쪽 = 상쇠·막쇠가 있는 끝(앞끝), 반대쪽 = 중간 치배가 접히는 끝.
// 화살표는 축 방향만 지정(상쇠 위치를 옮기지 않음). 
// 두 줄(상쇠 줄 0~mid, 막쇠 줄 mid~N-1)이 교차하지 않게 좌우 배치를 원진 감김방향으로 결정.
function animateToShibiljajin(axisX, axisY) {
  const cx = stageW / 2, cy = stageH / 2;
  const n = nodeCount;

  // 축 방향(앞끝→뒤끝, 즉 상쇠끝→중간끝). 화살표 첫점→둘째점 방향.
  let axX, axY;
  if (axisX !== undefined && axisY !== undefined) {
    axX = axisX; axY = axisY;
  } else {
    // 기본: 판 중심 → 상쇠 반대 (상쇠끝이 판 바깥 쪽 향하도록)
    axX = cx - nodes[0].x; axY = cy - nodes[0].y;
  }
  const L = Math.hypot(axX, axY) || 1;
  axX /= L; axY /= L;
  const perpX = -axY, perpY = axX; // 축의 왼쪽 수직

  // 진 무게중심 (회전 기준)
  let gx = 0, gy = 0;
  for (let i = 0; i < n; i++) { gx += nodes[i].x; gy += nodes[i].y; }
  gx /= n; gy /= n;

  // 원진 감김 방향 판정 (시계/반시계): 체인 순서로 각도 증분 합
  let angleSum = 0;
  for (let i = 1; i < n; i++) {
    angleSum += normAngle(Math.atan2(nodes[i].y - gy, nodes[i].x - gx) - Math.atan2(nodes[i-1].y - gy, nodes[i-1].x - gx));
  }
  const ccw = angleSum < 0; // SVG 좌표에서 각도 감소 = 반시계(관객 시점)

  // 11자진 파라미터
  const sangsoeLen = Math.floor(n / 2);
  const makseoLen = n - sangsoeLen;
  const nodeSpacing = Math.max(38, MIN_NODE_GAP + 6);
  const lineGap = Math.max(140, nodeSpacing * 3);

  // 상쇠 줄이 놓일 쪽(±perp). 원진을 접을 때 교차가 없으려면,
  // 감김 방향에 따라 상쇠 줄과 막쇠 줄의 좌우가 정해짐.
  // ccw(반시계)면 상쇠 줄을 perp의 +쪽, 아니면 -쪽 (경험적으로 반전).
  const sangsoeSide = ccw ? 1 : -1;
  const sPerpX = perpX * sangsoeSide, sPerpY = perpY * sangsoeSide;
  const mPerpX = -sPerpX, mPerpY = -sPerpY;

  // 접힘 앞끝(상쇠·막쇠 끝)의 기준선 위치: 진 무게중심에서 축 반대방향(-ax)으로 절반 뻗은 지점.
  // 두 줄의 앞끝이 여기서 시작해 축 방향으로 뻗음.
  const longest = Math.max(sangsoeLen, makseoLen);
  const halfLen = (longest - 1) * nodeSpacing / 2;
  // 앞끝 중앙 = 무게중심에서 -ax로 halfLen, perp 방향으로 두 줄 사이 중앙
  const frontCX = gx - axX * halfLen;
  const frontCY = gy - axY * halfLen;

  // 상쇠 줄 앞끝(상쇠 위치), 막쇠 줄 앞끝(막쇠 위치)
  const sangsoeBaseX = frontCX + sPerpX * (lineGap/2);
  const sangsoeBaseY = frontCY + sPerpY * (lineGap/2);
  const makseoBaseX = frontCX + mPerpX * (lineGap/2);
  const makseoBaseY = frontCY + mPerpY * (lineGap/2);

  const targetX = new Array(n), targetY = new Array(n), targetH = new Array(n);
  // 상쇠 줄 (id 0~sangsoeLen-1): 상쇠가 앞끝, 축 방향으로 뻗음, 막쇠 줄 바라봄
  for (let i = 0; i < sangsoeLen; i++) {
    targetX[i] = sangsoeBaseX + axX * (i * nodeSpacing);
    targetY[i] = sangsoeBaseY + axY * (i * nodeSpacing);
    targetH[i] = Math.atan2(mPerpY, mPerpX);
  }
  // 막쇠 줄 (id N-1~): 막쇠가 앞끝, 축 방향으로 뻗음, 상쇠 줄 바라봄
  for (let k = 0; k < makseoLen; k++) {
    const idx = n - 1 - k;
    targetX[idx] = makseoBaseX + axX * (k * nodeSpacing);
    targetY[idx] = makseoBaseY + axY * (k * nodeSpacing);
    targetH[idx] = Math.atan2(sPerpY, sPerpX);
  }

  // 상쇠 위치 고정: 전체 목표 배치를 평행이동해 상쇠(id 0)의 목표가 원래 위치와 일치하게 함
  const shiftX = nodes[0].x - targetX[0];
  const shiftY = nodes[0].y - targetY[0];
  for (let i = 0; i < n; i++) {
    targetX[i] += shiftX;
    targetY[i] += shiftY;
  }

  // 스냅숏
  const startX = nodes.map(nd => nd.x);
  const startY = nodes.map(nd => nd.y);
  const startH = nodes.map(nd => nd.heading);

  const duration = 1600;
  const startTime = performance.now();

  function step(now) {
    const elapsed = now - startTime;
    const t = Math.min(1, elapsed / duration);
    const e = easeInOut(t);
    for (let i = 0; i < nodes.length; i++) {
      nodes[i].x = startX[i] + (targetX[i] - startX[i]) * e;
      nodes[i].y = startY[i] + (targetY[i] - startY[i]) * e;
      nodes[i].heading = startH[i] + normAngle(targetH[i] - startH[i]) * e;
      nodes[i].detached = false;
    }
    draw();
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      showToast('11자진: 상쇠 줄 왼쪽, 두 줄 마주보기');
    }
  }
  requestAnimationFrame(step);
}

// 색으로 악기군 판정 (꽹과리 계열은 색이 같으므로 색 기반이 더 안전)
function instrumentColorOf(idx) { return getInstrument(idx).color; }

// 연결: 선택한 노드들을 진형(체인)에 연결하고, 
// 같은 악기군 내에서 1번(상치배)·끝번(말치배)을 제외한 중간 노드들만
// 위치상 최근접 순서로 재배열. 악기 간 순서는 유지.
document.getElementById('btnConnect').addEventListener('click', () => {
  const selIdx = nodes.map((n,i)=> n.selected ? i : -1).filter(i=>i>=0);
  if (selIdx.length < 2) { showToast('연결하려면 2명 이상 선택하세요'); return; }
  saveUndo();

  // 1) 선택된 detached 노드는 체인에 연결
  for (const i of selIdx) nodes[i].detached = false;

  // 1-b) 세그먼트 합체: 선택된 노드들 사이의 끊긴 링크를 복원
  let mended = 0;
  if (brokenLinks.size > 0) {
    const selSet = new Set(selIdx);
    for (const key of Array.from(brokenLinks)) {
      const [a, b] = key.split('-').map(Number);
      // 끊긴 링크의 양쪽 노드가 모두 선택돼 있으면 복원
      if (selSet.has(a) && selSet.has(b)) {
        brokenLinks.delete(key);
        mended++;
      }
    }
  }

  // 2) 악기군별로 그룹화 (전체 노드 기준, 인덱스 순서 = 악기 순서)
  const groups = {}; // color → [인덱스...] (오름차순 = 상치배..말치배)
  for (let i = 0; i < nodes.length; i++) {
    const c = instrumentColorOf(i);
    (groups[c] = groups[c] || []).push(i);
  }

  let reordered = 0;
  for (const color in groups) {
    const groupIdx = groups[color]; // 이 악기군의 전체 인덱스 (상치배..말치배 순)
    if (groupIdx.length <= 2) continue; // 중간 노드가 없으면 재배열 대상 없음

    // 이 악기군에서 재배열 대상 = 선택된 '중간' 노드 (첫·끝 제외)
    const first = groupIdx[0];              // 상치배(고정)
    const last = groupIdx[groupIdx.length-1]; // 말치배(고정)
    const middle = groupIdx.slice(1, -1);   // 재배열 가능 슬롯들
    const selectedMiddle = middle.filter(i => nodes[i].selected);
    if (selectedMiddle.length < 2) continue; // 재배열할 게 2개 미만이면 스킵

    // 재배열 대상 슬롯(위치 배열)과 그 안에 담긴 '내용물'(위치·상태) 분리.
    // 슬롯 순서(인덱스)는 고정, 내용물만 최근접 순서로 다시 채움.
    const slots = selectedMiddle.slice(); // 재배열될 인덱스들 (순서는 유지, 내용만 교체)
    // 내용물 스냅샷
    const contents = slots.map(i => ({
      x: nodes[i].x, y: nodes[i].y, heading: nodes[i].heading,
      detached: nodes[i].detached, sitting: nodes[i].sitting
    }));

    // 최근접 순서 결정: 시작점 = 상치배(first) 위치. 
    // 상치배에서 가장 가까운 내용물 → 그 다음 가까운 내용물 → ... 
    const startPt = { x: nodes[first].x, y: nodes[first].y };
    const used = new Array(contents.length).fill(false);
    const order = []; // contents 인덱스의 방문 순서
    let curPt = startPt;
    for (let step = 0; step < contents.length; step++) {
      let best = -1, bestD = Infinity;
      for (let c = 0; c < contents.length; c++) {
        if (used[c]) continue;
        const d = (contents[c].x-curPt.x)**2 + (contents[c].y-curPt.y)**2;
        if (d < bestD) { bestD = d; best = c; }
      }
      used[best] = true;
      order.push(best);
      curPt = { x: contents[best].x, y: contents[best].y };
    }

    // 슬롯에 최근접 순서대로 내용물 채우기
    for (let s = 0; s < slots.length; s++) {
      const slotIdx = slots[s];
      const content = contents[order[s]];
      nodes[slotIdx].x = content.x;
      nodes[slotIdx].y = content.y;
      nodes[slotIdx].heading = content.heading;
      nodes[slotIdx].detached = content.detached;
      nodes[slotIdx].sitting = content.sitting;
    }
    reordered += slots.length;
  }

  draw();
  const parts = [];
  if (mended > 0) parts.push(`끊긴 연결 ${mended}곳 복원`);
  if (reordered > 0) parts.push(`같은 악기군 ${reordered}명 위치순 재배열`);
  showToast(parts.length ? '연결: ' + parts.join(', ') : '연결됨');
});

// 분리: 선택한 노드들을 진형(체인)에서 분리 (detached 설정)
document.getElementById('btnDetach').addEventListener('click', () => {
  const sel = nodes.filter(n => n.selected);
  if (sel.length < 1) { showToast('분리할 노드를 선택하세요'); return; }
  saveUndo();
  snappedCircle = null;

  // 특수 케이스: 정확히 인접한(체인상 연속) 두 노드만 선택 → 그 사이 연결만 끊기 (진 끊기)
  const selIdx = nodes.map((n,i)=> n.selected ? i : -1).filter(i=>i>=0);
  if (selIdx.length === 2) {
    const chain = getChainIndices(); // detached 아닌 노드들 (체인 순서)
    const posA = chain.indexOf(selIdx[0]);
    const posB = chain.indexOf(selIdx[1]);
    if (posA >= 0 && posB >= 0 && Math.abs(posA - posB) === 1) {
      // 체인상 인접 → 두 노드 사이 링크를 끊음
      const lo = chain[Math.min(posA, posB)];
      const hi = chain[Math.max(posA, posB)];
      const key = lo + '-' + hi;
      if (brokenLinks.has(key)) {
        brokenLinks.delete(key);
        showToast('연결 복원');
      } else {
        brokenLinks.add(key);
        showToast('두 노드 사이 연결을 끊었습니다');
      }
      draw();
      return;
    }
  }

  // 일반: 선택 노드를 체인에서 분리 (개별 이동 가능)
  let count = 0;
  for (const i of selIdx) {
    if (!nodes[i].detached) { nodes[i].detached = true; count++; }
  }
  draw();
  showToast(count > 0 ? `${count}명을 진형에서 분리` : '이미 모두 분리되어 있습니다');
});

// bpm_min/bpm_max: 이 가락의 M.M. BPM 범위 (기준박은 tempo_reference에 명시). null이면 미입력.
// bpm_typical: 대표 M.M. (드롭다운에서 이 가락을 고르면 슬라이더가 이 값으로 이동. null 가능)
// tempo_reference: BPM 값이 어떤 음표 기준인지
//   'quarter' — 사분음표(♩) 기준 (2분박 가락, 오방진·이채 계열)
//   'dotted_quarter' — 점사분음표(♩.) 기준 (3분박 가락, 굿거리·삼채 계열)

let currentGasrak = null; // 현재 선택된 가락 이름
let currentBPM = 120;

// 슬라이더 값에 어울리는 가락만 드롭다운에 넣기
function refreshGasrakDropdown() {
  const sel = document.getElementById('gasrakSelect');
  if (!sel) return;
  const prev = sel.value;
  // 초기화
  sel.innerHTML = '<option value="">— 가락 선택 —</option>';

  // 필터링: BPM 범위 안에 currentBPM이 들어가는 가락
  const matching = [];
  const undefined_ = [];
  for (const g of gasrakList) {
    if (g.bpm_min != null && g.bpm_max != null) {
      if (currentBPM >= g.bpm_min && currentBPM <= g.bpm_max) {
        matching.push(g);
      }
    } else {
      undefined_.push(g);
    }
  }

  // 매칭되는 가락 (있으면 그룹으로 표시)
  if (matching.length > 0) {
    const og = document.createElement('optgroup');
    og.label = `현재 BPM(${currentBPM})에 어울리는 가락`;
    for (const g of matching) {
      const opt = document.createElement('option');
      opt.value = g.name;
      const beatTag = g.beat_structure ? ` ${g.beat_structure}` : '';
      const noteSym = g.tempo_reference === 'dotted_quarter' ? '♩.' :
                     g.tempo_reference === 'quarter' ? '♩' : 'BPM';
      opt.textContent = g.bpm_typical
        ? `${g.name}${beatTag} (${noteSym}=${g.bpm_min}–${g.bpm_max}, 표준 ${g.bpm_typical})`
        : `${g.name}${beatTag} (${noteSym}=${g.bpm_min}–${g.bpm_max})`;
      og.appendChild(opt);
    }
    sel.appendChild(og);
  }

  // BPM 데이터가 아직 없는 가락은 별도 그룹으로 (필터링 못 하니 항상 표시)
  if (undefined_.length > 0) {
    const og = document.createElement('optgroup');
    og.label = 'BPM 미입력 (필터링 불가)';
    for (const g of undefined_) {
      const opt = document.createElement('option');
      opt.value = g.name;
      const beatTag = g.beat_structure ? ` ${g.beat_structure}` : '';
      const refTag = g.tempo_reference === 'dotted_quarter' ? ' ♩.' :
                    g.tempo_reference === 'quarter' ? ' ♩' : '';
      opt.textContent = `${g.name}${beatTag}${refTag}`;
      og.appendChild(opt);
    }
    sel.appendChild(og);
  }

  // 이전 선택이 새 목록에 있으면 유지
  if (prev && [...sel.options].some(o => o.value === prev)) {
    sel.value = prev;
  }
}

// 슬라이더 <-> 숫자 입력 <-> 드롭다운 연동
(function initBPMControls() {
  const slider = document.getElementById('bpmSlider');
  const numberInput = document.getElementById('bpmValue');
  const sel = document.getElementById('gasrakSelect');
  if (!slider || !numberInput || !sel) return;

  function setBPM(v, source) {
    v = Math.max(30, Math.min(400, Math.round(v)));
    currentBPM = v;
    if (source !== 'slider') slider.value = v;
    if (source !== 'number') numberInput.value = v;
    refreshGasrakDropdown();
  }

  slider.addEventListener('input', () => setBPM(parseInt(slider.value), 'slider'));
  numberInput.addEventListener('input', () => {
    const v = parseInt(numberInput.value);
    if (!isNaN(v)) setBPM(v, 'number');
  });

  sel.addEventListener('change', () => {
    currentGasrak = sel.value || null;
    if (!currentGasrak) return;
    const g = gasrakList.find(x => x.name === currentGasrak);
    // 대표 BPM이 있으면 슬라이더도 그 값으로 이동
    if (g && g.bpm_typical != null) {
      setBPM(g.bpm_typical, 'gasrak');
      // dropdown 재구성 후에도 현재 가락이 여전히 유효하도록
      sel.value = currentGasrak;
    }
    showToast(`가락 선택: ${currentGasrak}`);
  });

  refreshGasrakDropdown();
})();

// Keyframes list
function renderKeyframes() {
  const list = document.getElementById('keyframesList');
  list.innerHTML = '';
  // 녹화된 동작 클립 목록 (있으면 먼저 표시)
  recordedClips.forEach((clip, i) => {
    const div = document.createElement('div');
    div.className = 'keyframe-item';
    const frames = clip.frames.length;
    div.innerHTML = `<span class="num">▶${i+1}</span><span class="name">동작 ${i+1} (${frames}프레임)</span><span class="del" data-clip="${i}">✕</span>`;
    div.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) {
        recordedClips.splice(parseInt(e.target.dataset.clip), 1);
        renderKeyframes();
        return;
      }
      // 클릭 시 그 클립의 마지막 프레임(동작 완료 상태)으로 스냅
      applySnapshot(clip.frames[clip.frames.length - 1]);
      draw();
    });
    list.appendChild(div);
  });
  keyframes.forEach((kf, i) => {
    const div = document.createElement('div');
    div.className = 'keyframe-item' + (i === activeKeyframe ? ' active' : '');
    div.innerHTML = `<span class="num">${i+1}</span><span class="name">${kf.name}</span><span class="del" data-idx="${i}">✕</span>`;
    div.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) {
        keyframes.splice(parseInt(e.target.dataset.idx), 1);
        activeKeyframe = Math.min(activeKeyframe, keyframes.length - 1);
        renderKeyframes();
        return;
      }
      activeKeyframe = i;
      loadKeyframe(i);
      renderKeyframes();
    });
    list.appendChild(div);
  });
  list.scrollTop = list.scrollHeight;
}

function loadKeyframe(idx) {
  if (idx < 0 || idx >= keyframes.length) return;
  const kf = keyframes[idx];
  for (let i = 0; i < Math.min(nodes.length, kf.nodes.length); i++) {
    nodes[i].x = kf.nodes[i].px;
    nodes[i].y = kf.nodes[i].py;
    if (kf.nodes[i].heading !== undefined) nodes[i].heading = kf.nodes[i].heading;
    nodes[i].detached = !!kf.nodes[i].detached;
    nodes[i].sitting = !!kf.nodes[i].sitting;
  }
  path = [];
  draw();
  showCoords(idx);
}

function showCoords(idx) {
  if (idx < 0 || idx >= keyframes.length) return;
  const kf = keyframes[idx];
  let text = `// ${kf.name}\n`;
  kf.nodes.forEach((n, i) => {
    text += `${i+1}. ${n.instrument}: (${n.x}, ${n.y})\n`;
  });
  document.getElementById('coordOutput').textContent = text;
}

// Playback
// 동작 클립 재생: 녹화된 각 클립의 프레임을 실제 순서대로 재생.
// 각 프레임 사이를 짧게 보간해 부드럽게. 클립 사이에는 잠깐 멈춤.
function playRecordedClips() {
  if (recordedClips.length === 0) { showToast('녹화된 동작이 없습니다.'); return; }
  if (isPlaying) { stopPlayback(); return; }
  isPlaying = true;
  const btn = document.getElementById('btnPlayback');
  btn.textContent = '⏹ 정지';
  btn.classList.add('active');

  // 첫 클립 첫 프레임으로 스냅
  applySnapshot(recordedClips[0].frames[0]);
  draw();

  const FRAME_MS = 16;      // 시각 정보가 없는 클립의 프레임 간격
  const CLIP_GAP_MS = 500;  // 클립 사이 멈춤
  let clipIdx = 0, frameIdx = 1;

  // 녹화된 실제 시각이 있으면 그 간격대로 (드래그 중 멈춘 순간까지 재현)
  function frameDelay(clip, k) {
    const t = clip.times;
    if (t && t.length === clip.frames.length && k + 1 < t.length) {
      return Math.max(0, t[k + 1] - t[k]);
    }
    return FRAME_MS;
  }

  function tick() {
    if (!isPlaying) return;
    const clip = recordedClips[clipIdx];
    if (frameIdx >= clip.frames.length) {
      // 다음 클립으로
      clipIdx++;
      frameIdx = 1;
      if (clipIdx >= recordedClips.length) { stopPlayback(); return; }
      applySnapshot(recordedClips[clipIdx].frames[0]);
      draw();
      playTimer = setTimeout(tick, CLIP_GAP_MS);
      return;
    }
    applySnapshot(clip.frames[frameIdx]);
    draw();
    const delay = frameDelay(clip, frameIdx);
    frameIdx++;
    playTimer = setTimeout(tick, delay);
  }
  playTimer = setTimeout(tick, 300);
}

// 스냅샷(노드 상태 배열)을 현재 노드에 적용
function applySnapshot(snap) {
  for (let i = 0; i < Math.min(nodes.length, snap.length); i++) {
    nodes[i].x = snap[i].x;
    nodes[i].y = snap[i].y;
    nodes[i].heading = snap[i].heading;
    nodes[i].detached = snap[i].detached;
    nodes[i].sitting = snap[i].sitting;
  }
}

document.getElementById('btnPlayback').addEventListener('click', () => {
  // 녹화된 동작 클립이 있으면 그것을 재생
  if (recordedClips.length > 0) { playRecordedClips(); return; }
  if (keyframes.length < 2) { showToast('녹화된 동작이나 키프레임이 필요합니다.'); return; }
  if (isPlaying) { stopPlayback(); return; }
  isPlaying = true;
  document.getElementById('btnPlayback').textContent = '⏹ 정지';
  document.getElementById('btnPlayback').classList.add('active');
  const speed = parseInt(document.getElementById('playSpeed').value);

  // 첫 번째 키프레임으로 즉시 스냅
  activeKeyframe = 0;
  loadKeyframe(0);
  renderKeyframes();

  let idx = 1;
  function playNext() {
    if (!isPlaying) return;
    if (idx >= keyframes.length) { stopPlayback(); return; }
    activeKeyframe = idx;
    renderKeyframes();
    animateToKeyframe(idx, speed * 0.7, () => {
      idx++;
      playTimer = setTimeout(playNext, speed * 0.3);
    });
  }
  // 짧은 대기 후 시작
  playTimer = setTimeout(playNext, speed * 0.3);
});

function stopPlayback() {
  isPlaying = false;
  clearTimeout(playTimer);
  document.getElementById('btnPlayback').textContent = '▶ 재생';
  document.getElementById('btnPlayback').classList.remove('active');
  document.getElementById('btnPlayAccel').textContent = '▶▶ 가속';
  document.getElementById('btnPlayAccel').classList.remove('active');
}

// 가속 재생: 프레임이 진행될수록 전환 속도가 빨라짐
document.getElementById('btnPlayAccel').addEventListener('click', () => {
  if (keyframes.length < 2) { showToast('키프레임이 2개 이상 필요합니다.'); return; }
  if (isPlaying) { stopPlayback(); return; }
  isPlaying = true;
  document.getElementById('btnPlayAccel').textContent = '⏹ 정지';
  document.getElementById('btnPlayAccel').classList.add('active');

  const baseSpeed = parseInt(document.getElementById('playSpeed').value);
  activeKeyframe = 0;
  loadKeyframe(0);
  renderKeyframes();

  let idx = 1;
  function playNextAccel() {
    if (!isPlaying) return;
    if (idx >= keyframes.length) { stopPlayback(); return; }
    // 진행률 0→1에 따라 속도를 baseSpeed → baseSpeed*0.15로 줄임 (= 빨라짐)
    const progress = idx / (keyframes.length - 1);
    const currentSpeed = baseSpeed * (1 - progress * 0.85);
    activeKeyframe = idx;
    renderKeyframes();
    animateToKeyframe(idx, currentSpeed * 0.7, () => {
      idx++;
      playTimer = setTimeout(playNextAccel, currentSpeed * 0.3);
    });
  }
  playTimer = setTimeout(playNextAccel, baseSpeed * 0.3);
});

function animateToKeyframe(idx, duration, onDone) {
  const kf = keyframes[idx];
  const startPositions = nodes.map(n => ({x: n.x, y: n.y, heading: n.heading, sitting: !!n.sitting}));
  const startTime = performance.now();
  const wasPlaying = isPlaying;

  function step(time) {
    if (wasPlaying && !isPlaying) return; // 재생 중지 시 즉시 종료
    const t = Math.min(1, (time - startTime) / duration);
    const ease = t < 0.5 ? 2*t*t : -1 + (4-2*t)*t;
    for (let i = 0; i < Math.min(nodes.length, kf.nodes.length); i++) {
      nodes[i].x = startPositions[i].x + (kf.nodes[i].px - startPositions[i].x) * ease;
      nodes[i].y = startPositions[i].y + (kf.nodes[i].py - startPositions[i].y) * ease;
      if (kf.nodes[i].heading !== undefined) {
        const delta = normAngle(kf.nodes[i].heading - startPositions[i].heading);
        nodes[i].heading = startPositions[i].heading + delta * ease;
      }
      // 앉음은 이산 상태 — 중간에 스위치
      const targetSit = !!kf.nodes[i].sitting;
      nodes[i].sitting = t < 0.5 ? startPositions[i].sitting : targetSit;
    }
    draw();
    if (t < 1) requestAnimationFrame(step);
    else if (onDone) onDone();
  }
  requestAnimationFrame(step);
}

document.getElementById('btnPrev').addEventListener('click', () => {
  if (keyframes.length === 0) return;
  activeKeyframe = Math.max(0, activeKeyframe - 1);
  loadKeyframe(activeKeyframe);

});

document.getElementById('btnNext').addEventListener('click', () => {
  if (keyframes.length === 0) return;
  activeKeyframe = Math.min(keyframes.length - 1, activeKeyframe + 1);

  renderKeyframes();
});
