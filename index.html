// ─── 기록 파일 저장/불러오기 ───
// 현재 진형·녹화 동작 클립·키프레임·끊긴 체인·간격을 .json 파일 하나로 주고받음.
// 스냅샷은 용량을 줄이려 노드마다 [x, y, heading, detached(0/1), sitting(0/1)] 배열로 압축.
const RECORD_FORMAT = 'gochang-nongak-record';
const RECORD_VERSION = 1;

function encodeSnap(snap) {
  return snap.map(s => [
    Math.round(s.x * 10) / 10,
    Math.round(s.y * 10) / 10,
    Math.round(s.heading * 1000) / 1000,
    s.detached ? 1 : 0,
    s.sitting ? 1 : 0,
  ]);
}

// dx, dy: 저장 당시와 지금 캔버스의 중심 차이만큼 평행이동
function decodeSnap(arr, dx, dy) {
  return arr.map(a => ({
    x: a[0] + dx, y: a[1] + dy, heading: a[2],
    detached: !!a[3], sitting: !!a[4],
  }));
}

function buildRecordFile() {
  return {
    format: RECORD_FORMAT,
    version: RECORD_VERSION,
    title: '고창농악 진형 기록',
    savedAt: new Date().toISOString(),
    stage: { width: stageW, height: stageH },
    nodeCount: nodes.length,
    instruments: nodes.map((_, i) => getInstrument(i).name),
    spacing: spacing,
    brokenLinks: Array.from(brokenLinks),
    current: encodeSnap(nodeSnapshot()),
    clips: recordedClips.map((c, i) => ({
      name: `동작 ${i + 1}`,
      times: c.times || null,
      frames: c.frames.map(encodeSnap),
    })),
    keyframes: keyframes.map(kf => ({
      name: kf.name,
      timestamp: kf.timestamp,
      nodes: kf.nodes,
    })),
  };
}

function recordFileName() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  // 파일명은 영문: 일부 브라우저가 한글 다운로드 파일명을 무시하고 "download"로 저장하기 때문
  return `gochang-nongak-record_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
}

document.getElementById('btnSaveFile').addEventListener('click', () => {
  if (isRecording && currentClip) { showToast('드래그를 마친 뒤 저장하세요'); return; }
  const json = JSON.stringify(buildRecordFile());
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = recordFileName();
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast(`저장: 동작 ${recordedClips.length}개, 키프레임 ${keyframes.length}개`);
});

// 파일 내용 검증. 문제가 있으면 사유 문자열, 정상이면 null.
function validateRecordFile(data) {
  if (!data || data.format !== RECORD_FORMAT) return '고창농악 기록 파일이 아닙니다';
  if (typeof data.version !== 'number' || data.version > RECORD_VERSION) return '이 도구보다 새 버전의 파일입니다';
  const n = data.nodeCount;
  if (!Number.isInteger(n) || n < 1 || n > 50) return '노드 수 정보가 잘못되었습니다';
  const okSnap = s => Array.isArray(s) && s.length === n &&
    s.every(a => Array.isArray(a) && a.length >= 3 && a.slice(0, 3).every(Number.isFinite));
  if (!okSnap(data.current)) return '현재 진형 정보가 손상되었습니다';
  if (!Array.isArray(data.clips) || !Array.isArray(data.keyframes)) return '동작/키프레임 목록이 없습니다';
  for (const c of data.clips) {
    if (!Array.isArray(c.frames) || c.frames.length < 2 || !c.frames.every(okSnap)) return '녹화 동작이 손상되었습니다';
  }
  return null;
}

function applyRecordFile(data) {
  if (isPlaying) stopPlayback();
  if (isRecording) stopRecording();
  saveUndo();

  // 노드 수 맞추기
  if (data.nodeCount !== nodes.length) {
    resizeNodeCount(data.nodeCount);
    document.getElementById('nodeCount').value = data.nodeCount;
  }

  // 캔버스 크기가 다르면 중심을 맞춰 평행이동 (모양·간격은 그대로)
  const sw = (data.stage && data.stage.width) || stageW;
  const sh = (data.stage && data.stage.height) || stageH;
  const dx = (stageW - sw) / 2, dy = (stageH - sh) / 2;

  // 동작 클립
  recordedClips = data.clips.map(c => {
    const frames = c.frames.map(f => decodeSnap(f, dx, dy));
    const times = (Array.isArray(c.times) && c.times.length === frames.length) ? c.times.slice() : undefined;
    return times ? { frames, times } : { frames };
  });

  // 키프레임 (절대좌표 px/py를 평행이동, 비율좌표는 현재 캔버스 기준으로 재계산)
  keyframes = data.keyframes.map(kf => ({
    name: kf.name,
    timestamp: kf.timestamp,
    nodes: (kf.nodes || []).map(nd => {
      const px = Math.round((nd.px || 0) + dx), py = Math.round((nd.py || 0) + dy);
      return Object.assign({}, nd, {
        px, py,
        x: Math.round(px * 100 / stageW) / 100,
        y: Math.round(py * 100 / stageH) / 100,
      });
    }),
  }));
  activeKeyframe = keyframes.length ? 0 : -1;

  // 끊긴 체인 (범위 안의 인접 인덱스 키만)
  brokenLinks = new Set((data.brokenLinks || []).filter(k => {
    const m = /^(\d+)-(\d+)$/.exec(k);
    return m && +m[2] < data.nodeCount;
  }));

  // 간격
  if (Number.isFinite(data.spacing)) {
    spacing = data.spacing;
    spacingSlider.max = Math.max(150, spacing + 20);
    spacingSlider.value = Math.max(30, Math.min(spacing, +spacingSlider.max));
    document.getElementById('spacingVal').textContent = spacing;
  }

  // 현재 진형
  applySnapshot(decodeSnap(data.current, dx, dy));
  for (const nd of nodes) nd.selected = false;
  snappedCircle = null;
  path = [];
  renderKeyframes();
  draw();

  const moved = (dx || dy) ? ' (캔버스 크기가 달라 중심에 맞춤)' : '';
  showToast(`불러옴: 동작 ${recordedClips.length}개, 키프레임 ${keyframes.length}개${moved}`);
}

const fileLoadInput = document.getElementById('fileLoadInput');
document.getElementById('btnLoadFile').addEventListener('click', () => {
  fileLoadInput.value = ''; // 같은 파일을 다시 골라도 change가 발생하도록
  fileLoadInput.click();
});
fileLoadInput.addEventListener('change', () => {
  const file = fileLoadInput.files && fileLoadInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch (err) { showToast('JSON 형식이 아닌 파일입니다'); return; }
    const problem = validateRecordFile(data);
    if (problem) { showToast('불러오기 실패: ' + problem); return; }
    if ((recordedClips.length || keyframes.length) &&
        !confirm('지금 작업 중인 동작·키프레임이 불러온 파일 내용으로 바뀝니다. 계속할까요?\n(필요하면 먼저 "기록 파일 저장"으로 저장하세요)')) {
      return;
    }
    applyRecordFile(data);
  };
  reader.onerror = () => showToast('파일을 읽지 못했습니다');
  reader.readAsText(file);
});

// ─── [보존 코드] 태극진 클러스터 ───
// 현재 UI에서 태극진 버튼이 빠져 미사용이지만, 도메인 알고리즘(원진→S자→원진,
// 반타원 두 개, 간격 유지 조정 등)을 담고 있어 재도입을 위해 보존.
// 태극진: 원진 안에 맞는 S자 (반타원 두 개)
// halfH = 세로 반지름 (원진 반지름의 절반, 고정)
// halfW = 가로 반지름 (간격 유지를 위해 조정 가능)
function generateTaegukPath(cx, cy, halfH, halfW, steps) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    let x, y;
    if (t <= 0.5) {
      // 상반타원: 꼭대기에서 오른쪽으로 돌아 중심까지
      const angle = -Math.PI / 2 + (t / 0.5) * Math.PI;
      x = cx + halfW * Math.cos(angle);
      y = (cy - halfH) + halfH * Math.sin(angle);
    } else {
      // 하반타원: 중심에서 왼쪽으로 돌아 바닥까지 (x 반전 → S자)
      const angle = -Math.PI / 2 + ((t - 0.5) / 0.5) * Math.PI;
      x = cx - halfW * Math.cos(angle);
      y = (cy + halfH) + halfH * Math.sin(angle);
    }
    pts.push({x, y});
  }
  return pts;
}

function measurePathLength(pts) {
  let len = 0;
  for (let i = 1; i < pts.length; i++) {
    len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  }
  return len;
}

// 경로 위에 균등 간격으로 N개 점 배치
function distributeOnPath(pts, count) {
  const totalLen = measurePathLength(pts);
  const segLen = totalLen / (count - 1);
  const result = [{x: pts[0].x, y: pts[0].y}];
  let accumulated = 0;
  let ptIdx = 1;
  for (let i = 1; i < count; i++) {
    const targetDist = i * segLen;
    while (ptIdx < pts.length && accumulated + Math.hypot(pts[ptIdx].x - pts[ptIdx - 1].x, pts[ptIdx].y - pts[ptIdx - 1].y) < targetDist) {
      accumulated += Math.hypot(pts[ptIdx].x - pts[ptIdx - 1].x, pts[ptIdx].y - pts[ptIdx - 1].y);
      ptIdx++;
    }
    if (ptIdx >= pts.length) {
      result.push({x: pts[pts.length - 1].x, y: pts[pts.length - 1].y});
    } else {
      const segDist = Math.hypot(pts[ptIdx].x - pts[ptIdx - 1].x, pts[ptIdx].y - pts[ptIdx - 1].y);
      const t = segDist > 0 ? (targetDist - accumulated) / segDist : 0;
      result.push({
        x: pts[ptIdx - 1].x + (pts[ptIdx].x - pts[ptIdx - 1].x) * t,
        y: pts[ptIdx - 1].y + (pts[ptIdx].y - pts[ptIdx - 1].y) * t,
      });
    }
  }
  return result;
}

// 노드들을 태극진 배치로 설정
function arrangeTaeguk() {
  const cx = stageW / 2;
  const cy = stageH / 2;
  const wonR = Math.min(stageW, stageH) * 0.36; // 원진 반지름
  const halfH = wonR / 2; // 세로: 원진 안에 딱 맞게 고정
  let halfW = halfH * 0.7; // 가로: 기본값 (찌그러진 타원)

  // 간격 유지를 위해 가로를 조정 (원진 안에 맞는 범위 내에서)
  const neededLen = (nodeCount - 1) * MIN_NODE_GAP;
  let pts = generateTaegukPath(cx, cy, halfH, halfW, 300);
  let len = measurePathLength(pts);

  while (len < neededLen && halfW < wonR * 0.9) {
    halfW += 3;
    pts = generateTaegukPath(cx, cy, halfH, halfW, 300);
    len = measurePathLength(pts);
  }

  // 균등 배치
  const positions = distributeOnPath(pts, nodeCount);

  for (let i = 0; i < nodeCount; i++) {
    nodes[i].x = positions[i].x;
    nodes[i].y = positions[i].y;
    nodes[i].detached = false;
    // 진행 방향 (다음 노드를 향함)
    if (i < nodeCount - 1) {
      nodes[i].heading = Math.atan2(positions[i + 1].y - positions[i].y, positions[i + 1].x - positions[i].x);
    } else {
      nodes[i].heading = nodes[i - 1].heading;
    }
  }
}

// 경로 보간 (Catmull-Rom 스플라인)
// ─── [보존 코드] 진형 전환 경로 헬퍼 (방법2 애니메이션용) ───
// 현재 미사용이지만 진형→진형 전환(캣멀롬 곡선 경로) 재도입을 위해 보존.
function catmullRomInterpolate(waypoints, totalPoints) {
  const pts = [];
  // 앞뒤에 가상 점 추가 (경계 처리)
  const wp = [waypoints[0], ...waypoints, waypoints[waypoints.length - 1]];
  const segs = wp.length - 3;
  const ptsPerSeg = Math.ceil(totalPoints / segs);

  for (let s = 0; s < segs; s++) {
    const p0 = wp[s], p1 = wp[s+1], p2 = wp[s+2], p3 = wp[s+3];
    const steps = (s === segs - 1) ? ptsPerSeg : ptsPerSeg;
    for (let i = 0; i < steps; i++) {
      const t = i / steps;
      const t2 = t*t, t3 = t2*t;
      const x = 0.5 * ((2*p1.x) + (-p0.x + p2.x)*t + (2*p0.x - 5*p1.x + 4*p2.x - p3.x)*t2 + (-p0.x + 3*p1.x - 3*p2.x + p3.x)*t3);
      const y = 0.5 * ((2*p1.y) + (-p0.y + p2.y)*t + (2*p0.y - 5*p1.y + 4*p2.y - p3.y)*t2 + (-p0.y + 3*p1.y - 3*p2.y + p3.y)*t3);
      pts.push({x, y});
    }
  }
  pts.push(wp[wp.length - 2]); // 마지막 점
  return pts;
}

// 상쇠의 전체 경로: 시계방향 원진 → S곡선(태극) → 반시계방향 원진
// 핵심: 태극진은 원진의 회전 방향을 뒤집는다.
// - Pre 원진: 시계방향(각도 증가). 6시에서 끝남.
// - S커브 하반: 6시에서 안쪽으로 진입, 중심을 지나 12시에 도달
// - Post 원진: 12시에서 진행 방향이 왼쪽(서쪽). 그 자리에서 왼쪽으로 진행하는 원은 반시계방향.
function buildTransitionPath(cx, cy, R) {
  const keyPts = [];

  // 1. Pre-S 원진: 시계방향으로 약 1.5바퀴, 6시에서 끝남
  // 시작: 12시(-π/2), 끝: 6시(+π/2). 시계방향 = 각도 증가.
  // 1.5바퀴 = 시작각 -π/2부터 끝각 π/2 + 2π까지 = 총 3π
  const preStart = -Math.PI / 2;
  const preEnd = Math.PI / 2 + Math.PI * 2; // 1.5바퀴 후 6시
  const preSteps = 36;
  for (let i = 0; i <= preSteps; i++) {
    const t = i / preSteps;
    const θ = preStart + (preEnd - preStart) * t;
    keyPts.push({x: cx + R * Math.cos(θ), y: cy + R * Math.sin(θ)});
  }
  // 마지막 점: (cx, cy + R) = 6시 방향

  // 2. S커브: 6시에서 안쪽으로 진입 → 중심 통과 → 12시로 탈출
  // 곡률 연속성: 시계방향 원에서 6시에 도달한 사람의 진행 방향은 서쪽(왼쪽).
  // 따라서 S자 하반은 왼쪽으로 부풀어야 자연스럽게 이어진다.
  // 12시에 도달했을 때 진행 방향은 서쪽(왼쪽) → 그 위치에서 왼쪽으로 가면 반시계방향 원진.
  // 따라서 S자 상반은 오른쪽으로 부풀어야 12시에서 왼쪽 접선으로 합류.
  const half = R / 2;
  const sSteps = 24;

  // 하반: 6시 → 왼쪽으로 불룩 → 중심
  // center = (cx, cy + half), 반지름 half
  // φ: π/2(아래) → -π/2(위), 매 단계마다 (cx - half·cos(φ), (cy+half) + half·sin(φ))
  // φ=π/2:  (cx - 0,    cy + half + half) = (cx, cy + R) ← 6시 ✓
  // φ=0:    (cx - half, cy + half)        ← 7-8시 영역, 왼쪽으로 불룩
  // φ=-π/2: (cx - 0,    cy + half - half) = (cx, cy) ← 중심 ✓
  for (let i = 1; i <= sSteps; i++) {
    const t = i / sSteps;
    const φ = Math.PI / 2 - Math.PI * t;
    keyPts.push({
      x: cx - half * Math.cos(φ),
      y: (cy + half) + half * Math.sin(φ),
    });
  }

  // 상반: 중심 → 오른쪽으로 불룩 → 12시
  // center = (cx, cy - half), 반지름 half
  // φ=π/2:  (cx + 0,    cy - half + half) = (cx, cy) ← 중심 ✓
  // φ=0:    (cx + half, cy - half)        ← 1-2시 영역, 오른쪽으로 불룩
  // φ=-π/2: (cx + 0,    cy - half - half) = (cx, cy - R) ← 12시 ✓
  for (let i = 1; i <= sSteps; i++) {
    const t = i / sSteps;
    const φ = Math.PI / 2 - Math.PI * t;
    keyPts.push({
      x: cx + half * Math.cos(φ),
      y: (cy - half) + half * Math.sin(φ),
    });
  }
  // 마지막 점: (cx, cy - R) = 12시

  // 3. Post-S 원진: 반시계방향으로 약 1.5바퀴
  // 시작: 12시(-π/2). S커브 끝에서 진행 방향은 왼쪽(서쪽).
  // 그 위치에서 왼쪽으로 가는 원의 접선 → 각도가 감소하는 방향 = 반시계방향.
  // 시작각 -π/2부터 끝각 -π/2 - 3π까지 (1.5바퀴 반시계).
  const postStart = -Math.PI / 2;
  const postEnd = -Math.PI / 2 - Math.PI * 3;
  const postSteps = 36;
  for (let i = 1; i <= postSteps; i++) {
    const t = i / postSteps;
    const θ = postStart + (postEnd - postStart) * t;
    keyPts.push({x: cx + R * Math.cos(θ), y: cy + R * Math.sin(θ)});
  }

  return keyPts;
}

// 경로 위에 노드 배치 (뱀처럼 따라가기)
function placeNodesOnPath(densePath, headDist, nodeSpacing, count) {
  // 누적 거리 배열
  const cumDist = [0];
  for (let i = 1; i < densePath.length; i++) {
    cumDist.push(cumDist[i-1] + Math.hypot(
      densePath[i].x - densePath[i-1].x,
      densePath[i].y - densePath[i-1].y
    ));
  }
  const totalLen = cumDist[cumDist.length - 1];

  function getPointAtDist(d) {
    if (d <= 0) return {...densePath[0]};
    if (d >= totalLen) return {...densePath[densePath.length - 1]};
    // 이진 탐색
    let lo = 0, hi = cumDist.length - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (cumDist[mid] < d) lo = mid; else hi = mid;
    }
    const seg = cumDist[hi] - cumDist[lo];
    const t = seg > 0 ? (d - cumDist[lo]) / seg : 0;
    return {
      x: densePath[lo].x + (densePath[hi].x - densePath[lo].x) * t,
      y: densePath[lo].y + (densePath[hi].y - densePath[lo].y) * t,
    };
  }

  const positions = [];
  for (let i = 0; i < count; i++) {
    const d = headDist - i * nodeSpacing;
    positions.push(getPointAtDist(Math.max(0, d)));
  }
  return positions;
}

// 난진(亂陣): 어름굿에서 사용. 일정한 형태 없음.
// 규칙 1: 치배들이 상쇠 주위로 모임 (상쇠 = 1번)
// 규칙 2: 같은 악기끼리 인접하지 않게 분산
// → 매번 약간씩 다른 모양으로 배치 (난진의 본질)
// 난진 배치. targetIdx 지정 시 그 노드들만, 그 무게중심 기준으로 분산.
// 미지정 시 전체(상쇠 중앙 고정).
function arrangeNanjin(targetIdx) {
  let cx, cy, indices, anchorIdx = -1;

  if (targetIdx && targetIdx.length >= 3) {
    // 선택된 노드들만: 무게중심 기준
    indices = targetIdx.slice();
    cx = 0; cy = 0;
    for (const i of indices) { cx += nodes[i].x; cy += nodes[i].y; }
    cx /= indices.length; cy /= indices.length;
    // 앵커(중앙 고정): 선택된 것 중 가장 앞 인덱스(상쇠에 가까운 역할)를 중앙에
    anchorIdx = Math.min(...indices);
    nodes[anchorIdx].x = cx; nodes[anchorIdx].y = cy;
    indices = indices.filter(i => i !== anchorIdx);
  } else {
    // 전체: 상쇠 중앙
    cx = stageW / 2; cy = stageH / 2;
    nodes[0].x = cx; nodes[0].y = cy;
    nodes[0].heading = Math.PI / 2;
    nodes[0].detached = false;
    anchorIdx = 0;
    indices = [];
    for (let i = 1; i < nodeCount; i++) indices.push(i);
  }

  // 같은 악기끼리 묶기 위해 색상 그룹 추출
  const groups = {};
  for (const i of indices) {
    const c = getInstrument(i).color;
    if (!groups[c]) groups[c] = [];
    groups[c].push(i);
  }

  const placed = [];
  const minSameColorDist = 58;
  const minAnyDist = 40;
  const clusterR = Math.min(stageW, stageH) * 0.24;

  const allIndices = [];
  const groupKeys = Object.keys(groups);
  let maxLen = 0;
  groupKeys.forEach(k => maxLen = Math.max(maxLen, groups[k].length));
  for (let r = 0; r < maxLen; r++) {
    for (const k of groupKeys) {
      if (groups[k][r] !== undefined) allIndices.push(groups[k][r]);
    }
  }

  for (const i of allIndices) {
    const myColor = getInstrument(i).color;
    let best = null;
    let bestScore = -Infinity;
    for (let attempt = 0; attempt < 50; attempt++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.sqrt(Math.random()) * clusterR + 40;
      const x = cx + Math.cos(angle) * dist;
      const y = cy + Math.sin(angle) * dist;
      if (x < 30 || x > stageW - 30 || y < 30 || y > stageH - 30) continue;
      let validAny = true;
      let minSameColor = Infinity;
      if (Math.hypot(x - cx, y - cy) < 40) continue;
      for (const p of placed) {
        const d = Math.hypot(x - p.x, y - p.y);
        if (d < minAnyDist) { validAny = false; break; }
        if (p.color === myColor && d < minSameColor) minSameColor = d;
      }
      if (!validAny) continue;
      const distFromCenter = Math.hypot(x - cx, y - cy);
      const score = (minSameColor === Infinity ? 200 : minSameColor)
                  - distFromCenter * 0.3
                  - (minSameColor < minSameColorDist ? 100 : 0);
      if (score > bestScore) { bestScore = score; best = {x, y}; }
    }
    if (!best) {
      const angle = Math.random() * Math.PI * 2;
      const dist = clusterR * (0.5 + Math.random() * 0.5);
      best = {x: cx + Math.cos(angle) * dist, y: cy + Math.sin(angle) * dist};
    }
    nodes[i].x = best.x;
    nodes[i].y = best.y;
    nodes[i].heading = Math.atan2(cy - best.y, cx - best.x) + (Math.random() - 0.5) * 0.6;
    nodes[i].detached = false;
    placed.push({x: best.x, y: best.y, color: myColor, idx: i});
  }
}

// ─── 캔버스 크기 조절 (파워포인트 방식) ───
// 캔버스 가장자리·꼭짓점 근처에 마우스 → 방향 커서로 바뀌고 드래그하면 크기 조절.
// 가장자리 어느 지점에서도 활성화됨.
(function setupCanvasResize() {
  const sizeLabel = document.getElementById('sizeLabel');
  const EDGE = 10; // 가장자리 감지 두께 (px)
  let dragging = null;   // {dir, startX, startY, startW, startH}
  let hoverDir = null;   // 현재 hover 중인 방향

  // 방향 → 커서 매핑
  function cursorFor(dir) {
    if (!dir) return '';
    if (dir === 'n' || dir === 's') return 'ns-resize';
    if (dir === 'e' || dir === 'w') return 'ew-resize';
    if (dir === 'nw' || dir === 'se') return 'nwse-resize';
    if (dir === 'ne' || dir === 'sw') return 'nesw-resize';
    return '';
  }

  // 마우스 위치(캔버스 좌표)에서 어느 가장자리인지 판정
  function edgeAt(mx, my) {
    const nearL = mx <= EDGE;
    const nearR = mx >= stageW - EDGE;
    const nearT = my <= EDGE;
    const nearB = my >= stageH - EDGE;
    // 캔버스 밖(약간)이나 안쪽 가장자리 모두 감지
    const inX = mx >= -EDGE && mx <= stageW + EDGE;
    const inY = my >= -EDGE && my <= stageH + EDGE;
    if (!inX || !inY) return null;
    let dir = '';
    if (nearT) dir += 'n';
    if (nearB) dir += 's';
    if (nearL) dir += 'w';
    if (nearR) dir += 'e';
    return dir || null;
  }

  function localMouse(e) {
    const rect = canvas.getBoundingClientRect();
    return { mx: e.clientX - rect.left, my: e.clientY - rect.top };
  }

  // 캔버스 위에서 마우스 이동 → 가장자리 감지 → 커서 변경
  canvas.addEventListener('mousemove', (e) => {
    if (dragging) return; // 드래그 중엔 아래 window 핸들러가 처리
    const { mx, my } = localMouse(e);
    const dir = edgeAt(mx, my);
    hoverDir = dir;
    canvas.style.cursor = dir ? cursorFor(dir) : '';
  });
  canvas.addEventListener('mouseleave', () => {
    if (!dragging) { hoverDir = null; canvas.style.cursor = ''; }
  });

  // 가장자리에서 드래그 시작
  function onResizeMove(e) {
    if (!dragging) return;
    const dx = e.clientX - dragging.startX;
    const dy = e.clientY - dragging.startY;
    const dir = dragging.dir;
    let dW = 0, dH = 0;
    if (dir.includes('e')) dW = dx * 2;
    if (dir.includes('w')) dW = -dx * 2;
    if (dir.includes('s')) dH = dy * 2;
    if (dir.includes('n')) dH = -dy * 2;
    customStageW = Math.max(280, dragging.startW + dW);
    customStageH = Math.max(200, dragging.startH + dH);
    resizeCanvas();
    sizeLabel.textContent = stageW + ' × ' + stageH;
  }
  function onResizeUp() {
    if (dragging) {
      dragging = null;
      document.body.style.cursor = '';
      sizeLabel.style.display = 'none';
    }
    window.removeEventListener('mousemove', onResizeMove);
    window.removeEventListener('mouseup', onResizeUp);
  }

  canvas.addEventListener('mousedown', (e) => {
    const { mx, my } = localMouse(e);
    const dir = edgeAt(mx, my);
    if (!dir) return; // 가장자리 아니면 기존 노드 조작에 맡김
    e.preventDefault();
    e.stopPropagation();
    dragging = {
      dir,
      startX: e.clientX,
      startY: e.clientY,
      startW: stageW,
      startH: stageH
    };
    document.body.style.cursor = cursorFor(dir);
    sizeLabel.style.display = 'block';
    sizeLabel.textContent = stageW + ' × ' + stageH;
    // 드래그 동안만 window 리스너 등록 → mouseup에서 확실히 해제
    window.addEventListener('mousemove', onResizeMove);
    window.addEventListener('mouseup', onResizeUp);
  }, true);

  // 가장자리 더블클릭 → 자동 크기 복귀
  canvas.addEventListener('dblclick', (e) => {
    const { mx, my } = localMouse(e);
    if (edgeAt(mx, my)) {
      e.preventDefault();
      e.stopPropagation();
      customStageW = null;
      customStageH = null;
      resizeCanvas();
    }
  }, true);
})();

// Init
// ─── 우클릭 컨텍스트 메뉴 ───
(function setupCtxMenu() {
  const menu = document.getElementById('ctxMenu');
  function hide() { menu.classList.remove('show'); }
  menu.addEventListener('click', (e) => {
    const act = e.target.dataset ? e.target.dataset.act : null;
    if (!act || ctxMenuNodeIdx < 0) { hide(); return; }
    const idx = ctxMenuNodeIdx;
    if (act === 'selectNode') {
      for (const n of nodes) n.selected = false;
      nodes[idx].selected = true;
      showToast('1명 선택');
    } else if (act === 'selectChain') {
      const seg = nodes[idx].detached ? [idx] : (getSegmentOf(idx).length ? getSegmentOf(idx) : [idx]);
      for (const n of nodes) n.selected = false;
      for (const i of seg) nodes[i].selected = true;
      showToast(`체인 ${seg.length}명 선택`);
    } else if (act === 'rotate') {
      // 회전 모드: 다음 드래그로 이 노드 방향 조절
      saveUndo();
      dragMode = 'rotate';
      dragNodeIdx = idx;
      canvas.style.cursor = 'grabbing';
      showToast('드래그해서 방향을 돌리세요');
    } else if (act === 'detach') {
      saveUndo();
      nodes[idx].detached = !nodes[idx].detached;
      showToast(nodes[idx].detached ? '분리됨' : '연결됨');
    } else if (act === 'sit') {
      saveUndo();
      nodes[idx].sitting = !nodes[idx].sitting;
      showToast(nodes[idx].sitting ? '앉음' : '일어섬');
    }
    hide();
    draw();
  });
  // 다른 곳 클릭·Esc·스크롤 시 닫기 (우클릭 자체와 메뉴 내부 클릭은 제외)
  document.addEventListener('mousedown', (e) => {
    if (e.button === 2) return;          // 우클릭은 메뉴 여는 동작이므로 제외
    if (menu.contains(e.target)) return; // 메뉴 내부 클릭 제외
    hide();
  }, true);
  window.addEventListener('blur', hide);
})();
