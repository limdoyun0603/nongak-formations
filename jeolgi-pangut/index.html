<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>절기 판굿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@200;300&family=IBM+Plex+Sans+KR:wght@300;400&display=swap">
<style>
/* 흰 바탕(밝은 화면) 또는 검은 바탕(어두운 화면) 한 장. 왼쪽 위 작은 절기 글자, 나머지는 위에서 내려다본 진풀이 */
:root{
  --bg:#ffffff;
  --ink:#141414;
  --ink-soft:rgba(20,20,20,.55);
  --trail:20,20,20;
  --accent:#9c4f33;
  --display:"Hahmlet","Noto Serif KR","Apple SD Gothic Neo",serif;
  --body:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0a0a0a; --ink:#ededeb; --ink-soft:rgba(237,237,235,.5); --trail:237,237,235; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#0a0a0a; --ink:#ededeb; --ink-soft:rgba(237,237,235,.5); --trail:237,237,235; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.term{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + clamp(20px,4vh,44px));
  left:max(clamp(20px,4vw,56px),env(safe-area-inset-left,0px));
  display:grid;gap:8px;max-width:min(17em,calc(100% - 40px));
}
.term .hanja{font-family:var(--display);font-weight:300;font-size:12px;letter-spacing:.9em;color:var(--accent)}
.term h1{margin:0;font-family:var(--display);font-weight:200;font-size:clamp(40px,5.2vw,64px);line-height:1;letter-spacing:.06em}
.term .desc{margin:4px 0 0;font-weight:300;font-size:13px;line-height:1.7}
.term .meta{margin:0;font-weight:300;font-size:11px;line-height:1.8;letter-spacing:.02em;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.term .meta b{font-weight:400;color:var(--ink)}
.term .preview{margin:0;font-size:11px;color:var(--accent)}
.weather{margin:6px 0 0;display:grid;gap:4px;font-weight:300;font-size:11px;line-height:1.7;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.weather .temp{font-family:var(--display);font-weight:200;font-size:28px;line-height:1.1;color:var(--ink);letter-spacing:.02em}
.weather .why{color:var(--ink)}
.weather button{font:inherit;color:var(--ink-soft);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;justify-self:start}
.weather button:hover{color:var(--ink)}
.weather button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.weather input[type=range]{width:100%;max-width:14em;accent-color:var(--accent)}
.foot{
  position:fixed;left:0;right:0;
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(clamp(20px,4vw,56px),env(safe-area-inset-left,0px));
  padding-right:max(clamp(20px,4vw,56px),env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;
  font-size:11px;font-weight:300;color:var(--ink-soft);letter-spacing:.04em;
}
.nav{display:flex;gap:16px;align-items:baseline}
.nav button{font:inherit;color:var(--ink-soft);background:none;border:0;padding:4px 0;cursor:pointer;letter-spacing:.04em}
.nav button:hover{color:var(--ink)}
.nav button:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
.nav button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="위에서 내려다본 고창농악 입장굿 진풀이"></canvas>

<header class="term" id="term" aria-live="polite">
  <div class="hanja" id="hanja">霜降</div>
  <h1 id="name">상강</h1>
  <p class="desc" id="desc"></p>
  <p class="meta" id="meta"></p>
  <div class="weather" id="weather">
    <div class="temp" id="temp">—</div>
    <div class="why" id="why"></div>
    <div id="tempSrc"></div>
    <button type="button" id="tryTemp" aria-expanded="false">기온 바꿔 보기</button>
    <input type="range" id="tempRange" min="-15" max="38" step="1" value="10" aria-label="기온 (°C)" hidden>
  </div>
  <p class="preview" id="previewNote" hidden></p>
</header>

<footer class="foot" id="foot">
  <span>고창농악 · 입장굿 · 위가 청중</span>
  <nav class="nav" aria-label="다른 절기 미리보기">
    <button id="prev" type="button">‹ 이전</button>
    <button id="today" type="button" aria-pressed="true">오늘</button>
    <button id="next" type="button">다음 ›</button>
  </nav>
</footer>

  ['상강','霜降','서리가 내리기 시작한다. 추수를 마무리한다.','#a8553a'],
  ['입동','立冬','겨울이 시작되는 때. 김장을 한다.','#d0752b'],
  ['소설','小雪','첫눈이 내린다.','#82919d'],
  ['대설','大雪','눈이 많이 내린다.','#768ea2'],
  ['동지','冬至','밤이 가장 길다.','#a8473a'],
  ['소한','小寒','한겨울 추위가 시작된다.','#6b8193'],
  ['대한','大寒','큰 추위. 겨울의 끝자락.','#5d7387'],
];
function solarLon(ms){
  const JD = ms/86400000 + 2440587.5, T = (JD - 2451545)/36525;
  const L0 = 280.46646 + 36000.76983*T + 0.0003032*T*T;
  const M = (357.52911 + 35999.05029*T - 0.0001537*T*T)*Math.PI/180;
  const C = (1.914602 - 0.004817*T - 0.000014*T*T)*Math.sin(M) + (0.019993 - 0.000101*T)*Math.sin(2*M) + 0.000289*Math.sin(3*M);
  const om = (125.04 - 1934.136*T)*Math.PI/180;
  const l = L0 + C - 0.00569 - 0.00478*Math.sin(om);
  return ((l % 360) + 360) % 360;
}
const termIdxAt = ms => Math.floor((((solarLon(ms) - 315) % 360) + 360) % 360 / 15);
const DAY = 86400000;
const kstToday = () => { const k = new Date(Date.now() + 9*3600000); return Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate()); };
const idxOfDay = dayMs => termIdxAt(dayMs + 15*3600000); // 그날 자정(한국 시간) 무렵의 절기
const fmt = dayMs => { const d = new Date(dayMs); return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일`; };
const today = kstToday();
const starts = [];
{ let prev = idxOfDay(today - 201*DAY);
  for (let d = today - 200*DAY; d <= today + 200*DAY; d += DAY) { const i = idxOfDay(d); if (i !== prev) { starts.push({ idx: i, day: d }); prev = i; } } }
const todayIdx = idxOfDay(today);
function termInfo(offset){
  const target = today + offset*15.2*DAY, idx = (todayIdx + offset + 240) % 24;
  let best = null;
  for (const s of starts) if (s.idx === idx && (!best || Math.abs(s.day - target) < Math.abs(best.day - target))) best = s;
  const next = starts[starts.indexOf(best) + 1];
  return { idx, start: best.day, end: next ? next.day - DAY : null, next };
}
function noonAltitude(lon){ const dec = Math.asin(Math.sin(23.4393*Math.PI/180)*Math.sin(lon*Math.PI/180))*180/Math.PI; return 90 - 35.43 + dec; }

// ───────── 진풀이 (기록 도구에서 그린 그대로, 위에서 내려다봄) ─────────
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const N = REC.instruments.length;
const KIND = REC.instruments.map(n => n === '상쇠' || n === '부쇠' || n.startsWith('꽹과리') ? 0 : n.startsWith('징') ? 1 : n.startsWith('장구') ? 2 : n.startsWith('북') ? 3 : n.startsWith('소고') ? 4 : 5);
// 기록 도구와 같은 악기 색 (꽹과리·징·장구·북·소고·잡색)
const COLOR = ['#e94560','#9b59b6','#3498db','#2ecc71','#e67e22','#f1c40f'];
const timeline = [];
{ let t0 = 0; REC.clips.forEach((c, i) => { const dur = c.t[c.t.length - 1]; timeline.push({ c, t0, dur }); const nx = REC.clips[i + 1]; t0 += dur + (nx ? (nx.joined ? 0 : 500) : 0); }); }
const showDur = timeline[timeline.length - 1].t0 + timeline[timeline.length - 1].dur;
const HOLD = 2600, FADE = 900, loopDur = showDur + HOLD;
// 원진 스냅과 스냅 탈출 시각 찾기 (이때 발자취를 지움)
// 스냅: 체인에 붙은 5명 이상이 고르게 한 원 위에 섬 / 탈출: 그 원 위에 남은 사람이 절반(최소 5명) 아래로 줄어듦
const RESETS = [];
{
  let circle = null;
  for (const seg of timeline) {
    const c = seg.c;
    for (let k = 0; k < c.t.length; k++) {
      const f = c.f[k], mask = c.d ? c.d[k] : 0, pts = [];
      for (let i = 0; i < N; i++) if (!(mask & (1 << i))) pts.push([f[i*3], f[i*3 + 1]]);
      const at = seg.t0 + c.t[k];
      if (!circle) {
        if (pts.length < 5) continue;
        let cx = 0, cy = 0; for (const [x, y] of pts) { cx += x; cy += y; } cx /= pts.length; cy /= pts.length;
        const rs = pts.map(([x, y]) => Math.hypot(x - cx, y - cy)), m = rs.reduce((a, b) => a + b, 0)/rs.length;
        const sd = Math.sqrt(rs.reduce((a, b) => a + (b - m)**2, 0)/rs.length);
        if (m > 20 && sd/m < 0.006) { circle = { cx, cy, m, n: pts.length }; RESETS.push(at); }
      } else {
        let on = 0; for (let i = 0; i < N; i++) if (Math.abs(Math.hypot(f[i*3] - circle.cx, f[i*3 + 1] - circle.cy) - circle.m) < 2.5) on++;
        if (on < Math.max(5, circle.n*0.5)) { circle = null; RESETS.push(at); }
      }
    }
  }
}
function frameAt(ms){
  let seg = timeline[0]; for (const s of timeline) if (ms >= s.t0) seg = s;
  const c = seg.c, local = Math.min(seg.dur, Math.max(0, ms - seg.t0));
  let lo = 0, hi = c.t.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c.t[m] <= local) lo = m; else hi = m; }
  const a = c.f[lo], b = c.f[hi], u = Math.min(1, Math.max(0, (local - c.t[lo])/((c.t[hi] - c.t[lo]) || 1)));
  const out = [];
  for (let i = 0; i < N; i++) {
    const ha = a[i*3 + 2]/100, hb = b[i*3 + 2]/100;
    let dh = hb - ha; while (dh > Math.PI) dh -= 2*Math.PI; while (dh < -Math.PI) dh += 2*Math.PI;
    out.push({ x: a[i*3] + (b[i*3] - a[i*3])*u, y: a[i*3 + 1] + (b[i*3 + 1] - a[i*3 + 1])*u, h: ha + dh*u });
  }
  return out;
}

let W = 0, H = 0, DPR = 1, view = null, offset = 0, info = null, trailRGB = '20,20,20';
// 진풀이를 놓을 자리: 글자와 아래 줄을 피해 남는 가장 넓은 칸에 꽉 차게
function computeView(){
  const term = document.getElementById('term').getBoundingClientRect();
  const foot = document.getElementById('foot').getBoundingClientRect();
  const m = Math.max(20, Math.min(W, H)*0.04);
  const top = m, bottom = foot.top - m*0.5;
  // 가로로 넓으면 글자 오른쪽, 아니면 글자 아래
  const side = { x0: term.right + m, y0: top, x1: W - m, y1: bottom };
  const below = { x0: m, y0: term.bottom + m*0.6, x1: W - m, y1: bottom };
  const [bx0, by0, bx1, by1] = REC.bbox;
  const pad = 26; // 노드 반지름만큼 여유
  const fit = r => Math.min((r.x1 - r.x0)/(bx1 - bx0 + pad*2), (r.y1 - r.y0)/(by1 - by0 + pad*2));
  const r = fit(side) >= fit(below) ? side : below;
  const s = Math.max(0.3, fit(r));
  return { s, ox: (r.x0 + r.x1)/2 - (bx0 + bx1)/2*s, oy: (r.y0 + r.y1)/2 - (by0 + by1)/2*s };
}
const toScreen = p => ({ x: view.ox + p.x*view.s, y: view.oy + p.y*view.s, h: p.h });

const TRAIL_MS = 5000;
let trails = Array.from({ length: N }, () => []), lastLoop = -1;

function drawTrails(now, alpha){
  ctx.lineCap = 'round';
  for (let i = 0; i < N; i++) {
    const tr = trails[i];
    for (let k = 1; k < tr.length; k++) {
      if (tr[k].cut) continue;
      const age = (now - tr[k].t)/TRAIL_MS;
      if (age >= 1) continue;
      ctx.strokeStyle = `rgba(${trailRGB},${(1 - age)*(i === 0 ? 0.42 : 0.2)*alpha})`;
      ctx.lineWidth = Math.max(0.8, view.s*(i === 0 ? 1.6 : 1.1));
      ctx.beginPath(); ctx.moveTo(tr[k - 1].x, tr[k - 1].y); ctx.lineTo(tr[k].x, tr[k].y); ctx.stroke();
    }
  }
}
// 노드: 기록 도구처럼 악기 색 원 + 바라보는 쪽 삼각형
function drawNode(i, p, alpha){
  const r = Math.max(4, 11*view.s);
  ctx.globalAlpha = alpha;
  const c = COLOR[KIND[i]];
  const tx = Math.cos(p.h), ty = Math.sin(p.h);
  ctx.fillStyle = c;
  // 원과 떨어진 작은 삼각형 (기록 도구의 방향 표시)
  const rr = i === 0 ? r*1.22 : r;
  ctx.beginPath();
  ctx.moveTo(p.x + tx*(rr + r*0.95), p.y + ty*(rr + r*0.95));
  ctx.lineTo(p.x - ty*r*0.42 + tx*(rr + r*0.3), p.y + tx*r*0.42 + ty*(rr + r*0.3));
  ctx.lineTo(p.x + ty*r*0.42 + tx*(rr + r*0.3), p.y - tx*r*0.42 + ty*(rr + r*0.3));
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}

// ───────── 기온 → 빠르기 ─────────
// 더울수록 뛰기 힘들어 진풀이는 느리게, 가락은 빠르게. 추울수록 손이 굳어 가락은 느리게, 몸을 덥히려 진풀이는 빠르게.
// 15°C 언저리가 녹화한 그대로(1배). -10°C에서 진풀이 1.35배·가락 0.75배, 35°C에서 진풀이 0.7배·가락 1.25배
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const jinSpeed = t => 1.35 - clamp((t + 10)/45, 0, 1)*0.65;
const garakSpeed = t => 0.75 + clamp((t + 10)/45, 0, 1)*0.5;
// 고창 달별 평균기온 어림값(°C, 1~12월). 실시간 날씨를 받지 못할 때와 다른 절기를 미리볼 때 씀
const NORMAL = [0.3, 1.8, 6.2, 12.2, 17.5, 21.9, 25.6, 26.0, 21.6, 15.2, 8.7, 2.6];
function normalTemp(dayMs){
  const d = new Date(dayMs), m = d.getUTCMonth(), x = (d.getUTCDate() - 15)/30;
  const a = NORMAL[m], b = NORMAL[(m + (x >= 0 ? 1 : 11)) % 12];
  return a + (b - a)*Math.abs(x);
}
let liveTemp = null, manualTemp = null, tempNow = 15, speed = 1;
function updateWeather(){
  const midDay = offset === 0 ? today : info.start + 7*DAY;
  let t, src;
  if (manualTemp !== null) { t = manualTemp; src = '직접 정한 기온'; }
  else if (offset === 0 && liveTemp !== null) { t = liveTemp; src = '고창 지금 기온'; }
  else { t = normalTemp(midDay); src = offset === 0 ? '고창 평년 기온 어림값 (실시간 날씨를 받지 못함)' : '고창 평년 기온 어림값'; }
  tempNow = t; speed = jinSpeed(t);
  const g = garakSpeed(t);
  document.getElementById('temp').textContent = `${Math.round(t)}°`;
  const feel = t >= 25 ? '더워서 진은 느리게, 가락은 빠르게' : t <= 5 ? '추워서 진은 빠르게, 가락은 느리게' : t < 15 ? '쌀쌀해서 진이 조금 빠르게' : '선선해서 거의 그대로';
  document.getElementById('why').textContent = `${feel} · 진 ${speed.toFixed(2)}배 · 가락 ${g.toFixed(2)}배`;
  document.getElementById('tempSrc').textContent = src;
  const rng = document.getElementById('tempRange');
  if (manualTemp === null) rng.value = String(Math.round(t));
}
// 실제 사이트에서는 고창(군청 부근) 지금 기온을 받아옴. 키가 필요 없는 공개 날씨 API를 씀
async function loadWeather(){
  try {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 6000);
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.4358&longitude=126.7019&current=temperature_2m&timezone=Asia%2FSeoul', { signal: ctrl.signal });
    clearTimeout(timer);
    const j = await res.json();
    const t = j && j.current && j.current.temperature_2m;
    if (typeof t === 'number') { liveTemp = t; updateWeather(); }
  } catch (e) { /* 막혀 있거나 실패하면 평년 어림값 그대로 */ }
}
document.getElementById('tryTemp').addEventListener('click', () => {
  const rng = document.getElementById('tempRange'), btn = document.getElementById('tryTemp');
  const open = rng.hidden;
  rng.hidden = !open; btn.setAttribute('aria-expanded', String(open));
  btn.textContent = open ? '원래 기온으로' : '기온 바꿔 보기';
  if (!open) { manualTemp = null; updateWeather(); }
});
document.getElementById('tempRange').addEventListener('input', e => { manualTemp = Number(e.target.value); updateWeather(); });

function readTheme(){ trailRGB = getComputedStyle(document.documentElement).getPropertyValue('--trail').trim() || '20,20,20'; }
function setTerm(off){
  offset = off;
  const ti = termInfo(off);
  info = { ...ti, lon: off === 0 ? solarLon(Date.now()) : (315 + ti.idx*15 + 7) % 360 };
  const [ko, hj, desc, accent] = TERMS[info.idx];
  document.getElementById('hanja').textContent = hj;
  document.getElementById('name').textContent = ko;
  document.getElementById('desc').textContent = desc;
  const days = info.next ? Math.round((info.next.day - today)/DAY) : null;
  let meta = `${fmt(info.start)}${info.end ? ' — ' + fmt(info.end) : ''}`;
  if (off === 0 && info.next) meta += `<br><b>${TERMS[info.next.idx][0]}</b>까지 ${days}일`;
  meta += `<br>고창 한낮 해 높이 ${Math.round(noonAltitude(info.lon))}°`;
  document.getElementById('meta').innerHTML = meta;
  const note = document.getElementById('previewNote');
  note.hidden = off === 0;
  note.textContent = off === 0 ? '' : `미리보는 중 · 오늘은 ${TERMS[todayIdx][0]}`;
  document.getElementById('today').setAttribute('aria-pressed', String(off === 0));
  document.getElementById('prev').textContent = `‹ ${TERMS[(info.idx + 23) % 24][0]}`;
  document.getElementById('next').textContent = `${TERMS[(info.idx + 1) % 24][0]} ›`;
  document.documentElement.style.setProperty('--accent', accent);
  canvas.setAttribute('aria-label', `${ko}. 위에서 내려다본 고창농악 입장굿 진풀이`);
  updateWeather();
  resize();
}
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  view = computeView();
  trails = Array.from({ length: N }, () => []);
  readTheme();
}
document.getElementById('prev').addEventListener('click', () => setTerm(offset - 1));
document.getElementById('next').addEventListener('click', () => setTerm(offset + 1));
document.getElementById('today').addEventListener('click', () => setTerm(0));
window.addEventListener('resize', resize);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { view = computeView(); });

setTerm(0);
loadWeather();
let prevT = performance.now(), playEl = 0;
function frame(now){
  const dt = Math.min(0.05, (now - prevT)/1000); prevT = now;
  const prevMs = playEl % loopDur;
  playEl += dt*1000*speed; // 기온에 따라 진풀이 빠르기
  const el = playEl, loop = Math.floor(el/loopDur), ms = el % loopDur;
  // 원진 스냅·탈출 순간을 지나면 발자취를 처음부터
  if (RESETS.some(t => prevMs < t && t <= ms)) trails = Array.from({ length: N }, () => []);
  if (loop !== lastLoop) { trails = Array.from({ length: N }, () => []); lastLoop = loop; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  let alpha = 1;
  if (ms > loopDur - FADE) alpha = Math.max(0, (loopDur - ms)/FADE);
  if (ms < FADE) alpha = Math.min(alpha, ms/FADE);
  const people = frameAt(Math.min(ms, showDur)).map(toScreen);
  for (let i = 0; i < N; i++) {
    const tr = trails[i], p = people[i], lp = tr[tr.length - 1];
    const d = lp ? Math.hypot(p.x - lp.x, p.y - lp.y) : 0;
    // 사람이 걸을 수 없는 속도(초당 녹화 650px 넘게)로 움직인 곳은 녹화 속 순간이동으로 보고 선을 끊음
    const jump = lp && d > Math.max(6, 650*view.s*Math.max(dt, 1/120)*speed);
    if (!lp || jump || d > 1.5) tr.push({ x: p.x, y: p.y, t: now, cut: !!jump });
    while (tr.length && now - tr[0].t > TRAIL_MS) tr.shift();
  }
  drawTrails(now, alpha);
  for (let i = N - 1; i >= 0; i--) drawNode(i, people[i], alpha);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
